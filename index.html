  <style>
    * {
      box-sizing: border-box;

    html, body {
      margin: 0;
      padding: 0;

        radial-gradient(circle at 20% 8%, rgba(16, 185, 129, 0.25) 0px, transparent 48%),
        radial-gradient(circle at 82% 18%, rgba(251, 191, 36, 0.18) 0px, transparent 50%),
        radial-gradient(circle at 50% 92%, rgba(6, 95, 70, 0.32) 0px, transparent 55%);
      color: #f8fafc;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;

    }

    input, select, textarea {
      font-size: 16px !important;

    }

    button, a, label {

    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(12px); }
      70% { opacity: 1; transform: scale(1.01) translateY(-1px); }

    .animate-pop { animation: popIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    /* Smooth Mobile Glass Card (Zero scroll-blocking transforms) */
    .cyber-glass {
      background: linear-gradient(155deg, rgba(6, 78, 59, 0.56), rgba(2, 44, 34, 0.86));
      backdrop-filter: blur(14px);

      border: 1px solid rgba(251, 191, 36, 0.28);

        0 16px 36px -14px rgba(0, 0, 0, 0.72),

      position: relative;
      overflow: hidden;
      touch-action: pan-y;
      transition: border-color 0.2s ease;
    }

    .cyber-glass:active {
      border-color: rgba(251, 191, 36, 0.65);
    }

    .cyber-glass::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(251,191,36,0.55), rgba(16,185,129,0.16), rgba(245,158,11,0.6));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);

    .kfm-splash-dots span:nth-child(3) { animation-delay: 0.4s; }

</head>
<body class="font-sans relative">
  <!-- 0ms Instant Splash Screen until React mounts -->
  <div id="root">
    <div class="kfm-splash">
      <img src="./logo.png" alt="KFM Logo" onerror="this.style.display='none'" />
      <div class="kfm-splash-title">KHANDELWAL FOOD MART</div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
      collection, addDoc, query, where,
      onSnapshot, serverTimestamp, increment, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 1. PROCEDURAL WEB AUDIO SFX ENGINE (0 KB OVERHEAD)
    // ==========================================
    class SoundEngine {
      constructor() {
        this.enabled = localStorage.getItem("kfm_sfx_muted") !== "1";
        this.ctx = null;
      }
      setEnabled(val) {
        this.enabled = val;
        localStorage.setItem("kfm_sfx_muted", val ? "0" : "1");
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume().catch(() => {});
        }
      }
      playTapSparkle() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.08);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.065, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      }
      playStarChime(pitchMultiplier = 1) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const freqs = [523.25, 659.25, 783.99, 1046.5];
        freqs.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(f * pitchMultiplier, now + idx * 0.06);
          gain.gain.setValueAtTime(0.001, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.06 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.06 + 0.34);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.36);
        });
      }
      playJackpotFanfare() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
        notes.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(f, now + i * 0.075);
          gain.gain.setValueAtTime(0.001, now + i * 0.075);
          gain.gain.exponentialRampToValueAtTime(0.16, now + i * 0.075 + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.075 + 0.55);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.075);
          osc.stop(now + i * 0.075 + 0.6);
        });
      }
    }
    const sfx = new SoundEngine();

    let globalTriggerBurst = () => {};

    // ==========================================
    // 2. MOBILE-FIRST 3D WEBGL + TAP FX STAGE (SCROLL-SAFE)
    // ==========================================
    function MobilePremiumStage({ active }) {
      const webglRef = useRef(null);
      const fxRef = useRef(null);

      useEffect(() => {
        if (!active) return;

        let animId = null;
        let renderer = null;
        let disposed = false;

        const fxCanvas = fxRef.current;
        const fxCtx = fxCanvas ? fxCanvas.getContext("2d") : null;
        let fxW = fxCanvas ? (fxCanvas.width = window.innerWidth) : 0;
        let fxH = fxCanvas ? (fxCanvas.height = window.innerHeight) : 0;
        const bursts = [];
        const shockwaves = [];

        const spawnBurst = (x, y, count = 14) => {
          if (!fxCtx) return;
          const palette = ["#fbbf24", "#fde047", "#10b981", "#34d399", "#fb923c", "#ffffff"];
          shockwaves.push({ x, y, r: 6, maxR: 95, alpha: 0.72 });
          for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
            const speed = 1.8 + Math.random() * 4.2;
            bursts.push({
              x, y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 1.0,
              gravity: 0.12,
              size: 2.4 + Math.random() * 3.0,
              life: 1,
              decay: 0.024 + Math.random() * 0.015,
              color: palette[Math.floor(Math.random() * palette.length)]
            });
          }
        };
        globalTriggerBurst = spawnBurst;

        // Trigger burst only on quick tap (not while dragging/scrolling)
        let touchStartPos = null;
        const onTouchStart = (e) => {
          const t = e.touches?.[0];
          if (t) touchStartPos = { x: t.clientX, y: t.clientY, time: Date.now() };
        };
        const onTouchEnd = (e) => {
          const t = e.changedTouches?.[0];
          if (!t || !touchStartPos) return;
          const dx = Math.abs(t.clientX - touchStartPos.x);
          const dy = Math.abs(t.clientY - touchStartPos.y);
          if (dx < 10 && dy < 10) {
            spawnBurst(t.clientX, t.clientY, 12);
          }
          touchStartPos = null;
        };
        window.addEventListener("touchstart", onTouchStart, { passive: true });
        window.addEventListener("touchend", onTouchEnd, { passive: true });

        let scene = null;
        let camera = null;
        let heroGroup = null;
        let heroStar = null;
        let ring1 = null;
        let ring2 = null;
        let starField = null;
        let tiltX = 0;
        let tiltY = 0;

        const onDeviceTilt = (e) => {
          if (typeof e.gamma === "number" && typeof e.beta === "number") {
            tiltX = Math.max(-1, Math.min(1, e.gamma / 30));
            tiltY = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
          }
        };
        window.addEventListener("deviceorientation", onDeviceTilt, { passive: true });

        const bootThreeTimer = setTimeout(() => {
          if (disposed || !window.THREE || !webglRef.current) return;
          const THREE = window.THREE;

          scene = new THREE.Scene();
          scene.fog = new THREE.FogExp2(0x021812, 0.036);

          camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
          camera.position.set(0, 0, 14);

          renderer = new THREE.WebGLRenderer({
            canvas: webglRef.current,
            alpha: true,
            antialias: true,
            powerPreference: "high-performance"
          });
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

          scene.add(new THREE.AmbientLight(0x10b981, 0.95));

          const goldLight = new THREE.PointLight(0xfbbf24, 2.6, 40);
          goldLight.position.set(4, 6, 10);
          scene.add(goldLight);

          const rimLight = new THREE.PointLight(0x34d399, 2.0, 40);
          rimLight.position.set(-5, -5, 6);
          scene.add(rimLight);

          const shape = new THREE.Shape();
          const spikes = 5;
          for (let i = 0; i < spikes * 2; i++) {
            const r = i % 2 === 0 ? 1.7 : 0.76;
            const angle = (i * Math.PI) / spikes - Math.PI / 2;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r;
            if (i === 0) shape.moveTo(x, y);
            else shape.lineTo(x, y);
          }
          shape.closePath();

          const geo = new THREE.ExtrudeGeometry(shape, {
            depth: 0.38,
            bevelEnabled: true,
            bevelSegments: 3,
            steps: 1,
            bevelSize: 0.13,
            bevelThickness: 0.13
          });
          geo.center();

          const mat = new THREE.MeshStandardMaterial({
            color: 0xfbbf24,
            metalness: 0.84,
            roughness: 0.18,
            emissive: 0x92400e,
            emissiveIntensity: 0.36
          });

          heroGroup = new THREE.Group();
          heroStar = new THREE.Mesh(geo, mat);
          heroGroup.add(heroStar);

          ring1 = new THREE.Mesh(
            new THREE.TorusGeometry(2.55, 0.038, 12, 72),
            new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.42 })
          );
          ring1.rotation.x = Math.PI / 3;
          heroGroup.add(ring1);

          ring2 = new THREE.Mesh(
            new THREE.TorusGeometry(3.1, 0.024, 12, 72),
            new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.32 })
          );
          ring2.rotation.y = Math.PI / 4;
          heroGroup.add(ring2);

          heroGroup.position.set(0, 2.7, -3.5);
          scene.add(heroGroup);

          const pCount = 240;
          const posArr = new Float32Array(pCount * 3);
          for (let i = 0; i < pCount * 3; i++) {
            posArr[i] = (Math.random() - 0.5) * 34;
          }
          const pGeo = new THREE.BufferGeometry();
          pGeo.setAttribute("position", new THREE.BufferAttribute(posArr, 3));
          starField = new THREE.Points(
            pGeo,
            new THREE.PointsMaterial({ size: 0.14, color: 0xfde047, transparent: true, opacity: 0.72 })
          );
          scene.add(starField);
        }, 160);

        const onResize = () => {
          if (fxCanvas) {
            fxW = fxCanvas.width = window.innerWidth;
            fxH = fxCanvas.height = window.innerHeight;
          }
          if (camera && renderer) {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
          }
        };
        window.addEventListener("resize", onResize);

        const renderLoop = (now) => {
          if (disposed) return;
          animId = requestAnimationFrame(renderLoop);

          if (document.hidden) return;

          if (renderer && scene && camera && heroStar) {
            heroStar.rotation.y += 0.015;
            heroStar.rotation.z = Math.sin(now * 0.0014) * 0.16;
            ring1.rotation.z += 0.011;
            ring2.rotation.x -= 0.009;
            heroGroup.position.x += (tiltX * 0.75 - heroGroup.position.x) * 0.06;
            heroGroup.position.y += (2.7 + tiltY * 0.65 - heroGroup.position.y) * 0.06;
            starField.rotation.y += 0.0015;
            renderer.render(scene, camera);
          }

          if (fxCtx && (shockwaves.length > 0 || bursts.length > 0)) {
            fxCtx.clearRect(0, 0, fxW, fxH);

            for (let i = shockwaves.length - 1; i >= 0; i--) {
              const sw = shockwaves[i];
              sw.r += (sw.maxR - sw.r) * 0.14;
              sw.alpha -= 0.036;
              if (sw.alpha <= 0) {
                shockwaves.splice(i, 1);
              } else {
                fxCtx.save();
                fxCtx.beginPath();
                fxCtx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
                fxCtx.strokeStyle = `rgba(251, 191, 36, ${sw.alpha})`;
                fxCtx.lineWidth = 2;
                fxCtx.stroke();
                fxCtx.restore();
              }
            }

            for (let i = bursts.length - 1; i >= 0; i--) {
              const p = bursts[i];
              p.x += p.vx;
              p.y += p.vy;
              p.vy += p.gravity;
              p.vx *= 0.96;
              p.life -= p.decay;
              if (p.life <= 0) {
                bursts.splice(i, 1);
              } else {
                fxCtx.save();
                fxCtx.globalAlpha = p.life;
                fxCtx.fillStyle = p.color;
                fxCtx.beginPath();
                fxCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                fxCtx.fill();
                fxCtx.restore();
              }
            }
          } else if (fxCtx) {
            fxCtx.clearRect(0, 0, fxW, fxH);
          }
        };

    const compressBillImage = (file) => {
      return new Promise((resolve, reject) => {
        if (!file || !ALLOWED_IMAGE_TYPES.includes(file.type)) {
          return reject(new Error("Sirf JPG, PNG ya WEBP image file hi allowed hai."));
        }
        if (file.size > MAX_RAW_FILE_BYTES) {
          return reject(new Error("File size 8 MB se kam honi chahiye."));
        }

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 900;
            const scale = MAX_WIDTH / img.width;
            canvas.width = img.width > MAX_WIDTH ? MAX_WIDTH : img.width;
            canvas.height = img.width > MAX_WIDTH ? img.height * scale : img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            let compressed = canvas.toDataURL("image/jpeg", 0.65);
            if (compressed.length > MAX_STORED_DATAURL_CHARS) {
              compressed = canvas.toDataURL("image/jpeg", 0.45);
            }
            if (compressed.length > MAX_STORED_DATAURL_CHARS || !isSafeImageDataUrl(compressed)) {
              return reject(new Error("Image bahut badi ya invalid hai, chhoti photo chunein."));
            }
            resolve(compressed);
          };
          img.onerror = () => reject(new Error("Corrupt ya invalid image file."));
        };
        reader.onerror = () => reject(new Error("File read nahi ho payi."));
      });
    };

    const toMillisSafe = (ts) => {
      if (!ts) return null;
      if (ts.toMillis) return ts.toMillis();
      if (ts.seconds) return ts.seconds * 1000;

    };

    const formatDateTime = (ts) => {
      const ms = toMillisSafe(ts);
      if (!ms) return "Date pending";
      const d = new Date(ms);
      const datePart = d.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
      const timePart = d.toLocaleTimeString("en-IN", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
      return `${datePart} • ${timePart}`;
    };

    const getDaysSince = (ts) => {

      const lastActMs = toMillisSafe(cust.lastActivityAt) || 0;

      const latestTouchMs = Math.max(lastActMs, lastRemMs);

      if (!latestTouchMs) {
        return { due: true, daysSince: null, nextInDays: 0 };
      }

      const daysPassed = Math.floor((Date.now() - latestTouchMs) / (1000 * 60 * 60 * 24));
      return {
        due: daysPassed >= REMINDER_DAYS_CYCLE,
        daysSince: daysPassed,
        nextInDays: Math.max(0, REMINDER_DAYS_CYCLE - daysPassed)
      };

        try {

            window.history.replaceState({ kfmGuard: true }, "");
            window.history.pushState({ kfmGuard: true, step: 1 }, "");
          }
        } catch (e) {}

        const handlePopState = () => {
          if (ignoreNextPopRef.current) {
            ignoreNextPopRef.current = false;
            return;
          }

          const backEvent = new CustomEvent("kfm:backbutton", { cancelable: true, detail: { handled: false } });
          window.dispatchEvent(backEvent);

          if (backEvent.detail.handled) {

              window.history.pushState({ kfmGuard: true, step: 1 }, "");

          const now = Date.now();

            ignoreNextPopRef.current = true;
            window.history.back();
          } else {
            lastBackPressRef.current = now;
            setBackToast("Ek baar aur Back dabayein app band karne ke liye");

        try {
          const compressed = await compressBillImage(file);
          setPreviewImage(compressed);
          setMsg(null);
          sfx.playTapSparkle();
        } catch (err) {
          e.target.value = "";
          setPreviewImage(null);
          setMsg({ type: "err", text: `⚠️ ${err.message}` });
        }
      };

      const handleBillSubmit = async (e) => {
        e.preventDefault();
        if (!verifyCsrfToken(SESSION_CSRF_TOKEN)) return;

        const lastUploadMs = Number(localStorage.getItem("kfm_last_bill_upload_ms") || 0);
        const elapsed = Date.now() - lastUploadMs;
        if (elapsed < BILL_COOLDOWN_MS) {
          const waitSec = Math.ceil((BILL_COOLDOWN_MS - elapsed) / 1000);
          return setMsg({ type: "err", text: `⏳ Kripya ${waitSec} second ruk kar agla bill upload karein.` });
        }

        const cleanBillNo = sanitizeText(billNumber, 20)
          .toUpperCase()
          .replace(/[^A-Z0-9\-\/]/g, "");
        const amt = claimedAmount ? Math.floor(Number(claimedAmount)) : 0;

        if (!cleanBillNo || cleanBillNo.length < 2) {
          return setMsg({ type: "err", text: "Valid Invoice / Bill Number likhein (letters/numbers only)." });
        }
        if (claimedAmount && (isNaN(amt) || amt < MIN_BILL_AMOUNT || amt > MAX_BILL_AMOUNT)) {
          return setMsg({
            type: "err",
            text: `Bill amount ₹${MIN_BILL_AMOUNT} se ₹${MAX_BILL_AMOUNT.toLocaleString("en-IN")} ke beech hona chahiye.`
          });
        }
        if (!previewImage || !isSafeImageDataUrl(previewImage)) {
          return setMsg({ type: "err", text: "Valid bill image (JPG/PNG/WEBP) upload karein." });
        }

        setUploading(true);
        setMsg(null);

        try {
          await ensureCustomerAuth();
          const dupQ = query(collection(db, "bill_submissions"), where("billNumber", "==", cleanBillNo));
          const dupSnap = await getDocs(dupQ);
          if (dupSnap.docs.some((d) => d.data().status !== "rejected")) {
            setUploading(false);
            return setMsg({ type: "err", text: `Invoice #${cleanBillNo} pehle hi upload ho chuka hai.` });
          }

          await addDoc(collection(db, "bill_submissions"), {
            phone: customer.phone,
            customerName: sanitizeText(customer.name, 40),
            billNumber: cleanBillNo,
            claimedAmount: amt,
            imageBase64: previewImage,
            status: "pending",
            starsAwarded: 0,
            createdAt: serverTimestamp()
          });

          await updateDoc(doc(db, "customers", customer.phone), {
            lastActivityAt: serverTimestamp()
          });

          localStorage.setItem("kfm_last_bill_upload_ms", String(Date.now()));
          setBillNumber("");
          setClaimedAmount("");
          setPreviewImage(null);
          setMsg({
            type: "ok",
            text: "✅ Bill upload ho gaya! Verification ke baad Star add ho jayega."
          });

          sfx.playStarChime(1.1);
          globalTriggerBurst(window.innerWidth / 2, window.innerHeight / 2, 38);

          setActivePopup({
            type: "upload_success",
            billNumber: cleanBillNo
          });
        } catch (err) {
          setMsg({ type: "err", text: "Upload nahi ho paya. Internet ya Firebase Rules check karein." });
        }
        setUploading(false);
      };

      const handleItemRequestSubmit = async (e) => {
        e.preventDefault();
        if (!verifyCsrfToken(SESSION_CSRF_TOKEN)) return;

        const lastReqMs = Number(localStorage.getItem("kfm_last_demand_ms") || 0);
        const elapsed = Date.now() - lastReqMs;
        if (elapsed < DEMAND_COOLDOWN_MS) {
          const waitSec = Math.ceil((DEMAND_COOLDOWN_MS - elapsed) / 1000);

        const cleanItem = sanitizeText(itemRequest, 80);
        if (cleanItem.length < 2) return;

        setRequestSending(true);
        try {
          await ensureCustomerAuth();
          await addDoc(collection(db, "item_requests"), {
            phone: customer.phone,
            customerName: sanitizeText(customer.name, 40),
            itemName: cleanItem,
            createdAt: serverTimestamp()

          setRequestSentMsg(`✅ "${cleanItem}" note kar liya hai! Samaan aate hi WhatsApp par batayenge.`);

                {activePopup.type === "reward_complete" && (

                    <div className="w-14 h-14 mx-auto rounded-2xl bg-amber-400/20 border border-amber-400/40 text-3xl flex items-center justify-center mb-2.5">

                    </span>
                    <h3 className="text-lg font-extrabold text-white mt-2">

          {showHomeScreenModal && (

                <div>
                  <label className="block text-[11px] font-bold text-amber-300 mb-1">
                    Invoice No. <span className="text-red-400">*</span>
                  </label>
                  <input
                    type="text"
                    maxLength={20}
                    placeholder="e.g. 1042"
                    value={billNumber}
                    onChange={(e) => setBillNumber(e.target.value)}
                    className="w-full px-3 py-3 bg-black/45 border-2 border-emerald-500/35 focus:border-amber-400 rounded-2xl font-bold text-white placeholder-emerald-300/35 uppercase outline-none transition"
                    required
                  />
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-amber-300 mb-1">Amount (Optional)</label>
                  <input
                    type="number"
                    inputMode="numeric"
                    min={MIN_BILL_AMOUNT}
                    max={MAX_BILL_AMOUNT}
                    placeholder="1000+"
                    value={claimedAmount}
                    onChange={(e) => setClaimedAmount(e.target.value)}
                    className="w-full px-3 py-3 bg-black/45 border-2 border-emerald-500/35 focus:border-amber-400 rounded-2xl font-bold text-white placeholder-emerald-300/35 outline-none transition"
                  />
                </div>
              </div>

              {numericAmt >= MIN_BILL_AMOUNT && numericAmt < 2000 && (
                <div className="bg-amber-400/15 border border-amber-400/40 rounded-2xl px-3 py-2.5 text-xs text-amber-200 flex items-start gap-2 animate-pop">
                  <span className="text-base leading-none mt-0.5">💡</span>
                  <p className="leading-snug text-[11px]">
                    <strong className="text-amber-300">Smart Tip:</strong> ₹2,000+ ki shopping par seedha <strong className="text-white">2 Stars</strong> milte hain! Agli baar ₹{2000 - numericAmt} aur add karne par double star payein.
                  </p>
                </div>
              )}
              {numericAmt >= 2000 && numericAmt <= MAX_BILL_AMOUNT && (
                <div className="bg-emerald-500/20 border border-emerald-400/40 rounded-2xl px-3 py-2 text-xs text-emerald-200 flex items-center gap-2 animate-pop">
                  <span className="text-base">🔥</span>
                  <p className="font-bold text-[11px]">
                    Shandar! ₹{numericAmt} ke bill par aapko <span className="text-amber-300">{Math.floor(numericAmt / 1000)} Stars</span> milenge!
                  </p>
                </div>
              )}

              <div>
                <label className="block text-[11px] font-bold text-amber-300 mb-1">
                  Bill Ki Photo <span className="text-red-400">*</span>
                </label>
                <label className="border-2 border-dashed border-amber-400/45 active:border-amber-300 rounded-2xl p-4 flex flex-col items-center justify-center cursor-pointer bg-black/35 transition">
                  {previewImage && isSafeImageDataUrl(previewImage) ? (
                    <div className="text-center animate-pop">
                      <img src={previewImage} className="max-h-44 rounded-xl shadow-lg mx-auto" />
                      <span className="inline-block mt-2 text-[11px] font-bold text-amber-300">
                        🔄 Photo Badalne Ke Liye Tap Karein
                      </span>
                    </div>
                  ) : (
                    <div className="text-center py-2">
                      <div className="text-3xl mb-1.5">📷</div>
                      <span className="text-xs font-extrabold text-white block">
                        Camera Kholne / Bill Photo Chunne Ke Liye Tap Karein
                      </span>
                      <span className="text-[10px] text-emerald-200/70">JPG/PNG/WEBP only • Max 8 MB</span>
                    </div>
                  )}
                  <input
                    type="file"
                    accept="image/jpeg,image/png,image/webp"
                    capture="environment"
                    onChange={handleFile}
                    className="hidden"
                  />
                </label>
              </div>

              <button
                type="submit"
                disabled={uploading}
                className="gold-reactor-btn w-full text-sm py-3.5 rounded-2xl"
              >
                {uploading ? "Uploading Bill..." : "✨ Submit Bill & Claim Star ⭐"}
              </button>
            </form>
          </MobileGlassCard>

          {/* MISSING ITEM / DEMAND REQUEST BOX */}
          <MobileGlassCard className="rounded-3xl p-4">
            <div className="flex items-center gap-2 mb-2.5 relative z-10">
              <div className="w-8 h-8 rounded-xl bg-amber-400/20 border border-amber-400/35 text-base flex items-center justify-center shrink-0">
                💬
              </div>
              <div>
                <h3 className="font-extrabold text-white text-xs">
                  Koi Samaan Nahi Mila? Humein Batayein
                </h3>
                <p className="text-[10px] text-emerald-200/75">
                  Item likhein—mangwa kar aapko WhatsApp par batayenge
                </p>
              </div>
            </div>

            {requestSentMsg && (
              <div className="mb-2.5 px-3 py-2 rounded-xl bg-emerald-500/20 border border-emerald-400/40 text-emerald-200 text-[11px] font-semibold animate-pop relative z-10">
                {requestSentMsg}
              </div>
            )}

            <form onSubmit={handleItemRequestSubmit} className="flex gap-2 relative z-10">
              <input
                type="text"
                maxLength={80}
                placeholder="Jaise: Amul Cheese, Honey..."
                value={itemRequest}
                onChange={(e) => setItemRequest(e.target.value)}
                className="flex-1 min-w-0 px-3.5 py-2.5 bg-black/45 border border-emerald-500/35 focus:border-amber-400 rounded-2xl font-medium text-white placeholder-emerald-300/35 outline-none transition"
              />
              <button
                type="submit"
                disabled={requestSending || !itemRequest.trim()}
                className="gold-reactor-btn px-4 py-2.5 rounded-2xl disabled:opacity-40 text-xs shrink-0"
              >
                {requestSending ? "..." : "Bhejein"}
              </button>
            </form>
          </MobileGlassCard>

          {/* CUSTOMER BILL HISTORY */}
          {myBills.length > 0 && (
            <MobileGlassCard className="rounded-3xl p-5">
              <h3 className="font-extrabold text-amber-300 text-xs uppercase tracking-wider mb-3 flex items-center gap-1.5 relative z-10">
                🧾 Aapke Uploaded Bills ({myBills.length})
              </h3>
              <div className="space-y-2 relative z-10">
                {myBills.map((b) => {
                  const awarded = b.starsAwarded || 1;
                  return (
                    <div
                      key={b.id}
                      className={`flex items-center justify-between gap-2 p-3 rounded-2xl border ${
                        b.status === "approved"
                          ? "bg-emerald-950/60 border-emerald-400/35"
                          : b.status === "pending"
                          ? "bg-amber-950/45 border-amber-400/35"
                          : "bg-red-950/50 border-red-400/35"
                      }`}
                    >
                      <div className="min-w-0">
                        <p className="text-xs font-extrabold text-white">
                          Invoice #{b.billNumber}
                          {b.claimedAmount > 0 ? ` • ₹${b.claimedAmount}` : ""}
                        </p>
                        <p className="text-[10px] text-emerald-200/70 mt-0.5">
                          📅 {formatDateTime(b.createdAt)}
                        </p>
                        {b.status === "rejected" && b.rejectReason && (
                          <p className="text-[11px] text-red-300 mt-0.5">Reason: {b.rejectReason}</p>
                        )}
                      </div>

                      <div className="flex items-center gap-1.5 shrink-0">
                        {isSafeImageDataUrl(b.imageBase64) && (
                          <button
                            type="button"
                            onClick={() =>
                              setZoomBillData({
                                src: b.imageBase64,
                                title: `Invoice #${b.billNumber} (${formatDateTime(b.createdAt)})`
                              })
                            }
                            className="px-2.5 py-1.5 rounded-lg bg-white/10 border border-white/20 text-[10px] font-bold text-white active:bg-white/20"
                            title="Zoom Bill Photo"
                          >
                            🔍 Bill
                          </button>
                        )}
                        <span
                          className={`text-[11px] font-extrabold px-2.5 py-1 rounded-full ${
                            b.status === "pending"
                              ? "bg-amber-400/20 text-amber-300 border border-amber-400/35"
                              : b.status === "approved"
                              ? "bg-amber-400 text-emerald-950 shadow-sm"
                              : "bg-red-500/25 text-red-200 border border-red-400/35"
                          }`}
                        >
                          {b.status === "pending"
                            ? "⏳ Pending"
                            : b.status === "approved"
                            ? `⭐ +${awarded} ${awarded > 1 ? "Stars" : "Star"}`
                            : "❌ Rejected"}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </MobileGlassCard>
          )}

          {zoomBillData && (
            <BillZoomModal
              src={zoomBillData.src}
              title={zoomBillData.title}
              onClose={() => setZoomBillData(null)}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // ADMIN PORTAL (MOBILE-OPTIMIZED OWNER DASHBOARD)
    // ==========================================
    function AdminPortal() {
      const [unlocked, setUnlocked] = useState(() => isCurrentUserOwner());
      const [ownerEmail, setOwnerEmail] = useState(() => localStorage.getItem("kfm_owner_email") || "");
      const [ownerPassword, setOwnerPassword] = useState("");
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState("");
      const lastAdminTouchRef = useRef(Date.now());

      const [tab, setTab] = useState("pending");
      const [customerFilter, setCustomerFilter] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      const [pendingBills, setPendingBills] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [itemRequests, setItemRequests] = useState([]);
      const [starInputs, setStarInputs] = useState({});
      const [zoomData, setZoomData] = useState(null);

      const [selectedRecordPhone, setSelectedRecordPhone] = useState("");
      const [recordSearch, setRecordSearch] = useState("");
      const [customerRecordBills, setCustomerRecordBills] = useState([]);
      const [loadingRecords, setLoadingRecords] = useState(false);

      const lockAdminSession = async (showIdleAlert = false) => {
        setUnlocked(false);
        setOwnerPassword("");
        try {
          await signOut(auth);
          authInitPromise = null;
          await ensureCustomerAuth();
        } catch (e) {}
        if (showIdleAlert) {
          alert("Security Timeout: 15 minute inactivity ke baad Owner Dashboard auto-lock ho gaya hai.");
        }
      };

      useEffect(() => {
        const onAdminBack = (e) => {
          if (zoomData) {
            e.detail.handled = true;
            setZoomData(null);
          } else if (unlocked && tab === "records" && selectedRecordPhone) {
            e.detail.handled = true;
            setSelectedRecordPhone("");
          } else if (unlocked && tab !== "pending") {
            e.detail.handled = true;
            setTab("pending");
          }
        };

        window.addEventListener("kfm:backbutton", onAdminBack);
        return () => window.removeEventListener("kfm:backbutton", onAdminBack);
      }, [zoomData, unlocked, tab, selectedRecordPhone]);

      useEffect(() => {
        const timer = setInterval(() => {
          if (unlocked && Date.now() - lastAdminTouchRef.current > ADMIN_IDLE_TIMEOUT_MS) {
            lockAdminSession(true);
          }
        }, 5000);

        const touchActivity = () => {
          lastAdminTouchRef.current = Date.now();
        };
        window.addEventListener("pointerdown", touchActivity);
        window.addEventListener("keydown", touchActivity);

        return () => {
          clearInterval(timer);
          window.removeEventListener("pointerdown", touchActivity);
          window.removeEventListener("keydown", touchActivity);
        };
      }, [unlocked]);

      useEffect(() => {
        if (!unlocked) return;

        const qBills = query(collection(db, "bill_submissions"), where("status", "==", "pending"));
        const unsub1 = onSnapshot(qBills, (snap) => {
          const list = [];
          snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
          list.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
          setPendingBills(list);
        });

        const unsub2 = onSnapshot(collection(db, "customers"), (snap) => {
          const list = [];
          snap.forEach((d) => list.push(d.data()));
          list.sort((a, b) => (b.totalApprovedBills || 0) - (a.totalApprovedBills || 0));
          setCustomers(list);
        });

        const unsub3 = onSnapshot(collection(db, "item_requests"), (snap) => {
          const list = [];
          snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
          list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
          setItemRequests(list);
        });

        return () => {
          unsub1();
          unsub2();
          unsub3();
        };
      }, [unlocked]);

      useEffect(() => {
        if (!unlocked || !selectedRecordPhone) {
          setCustomerRecordBills([]);
          return;
        }

        setLoadingRecords(true);
        const qRec = query(collection(db, "bill_submissions"), where("phone", "==", selectedRecordPhone));
        const unsubRec = onSnapshot(qRec, (snap) => {
          const list = [];
          snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
          list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
          setCustomerRecordBills(list);
          setLoadingRecords(false);
        });

        return () => unsubRec();
      }, [unlocked, selectedRecordPhone]);

      const handleUnlockSubmit = async (e) => {
        e.preventDefault();
        if (!verifyCsrfToken(SESSION_CSRF_TOKEN)) return;

        const cleanEmail = ownerEmail.trim().toLowerCase();
        if (!cleanEmail || !ownerPassword) return;

        setAuthLoading(true);
        setAuthError("");
        try {
          await signInWithEmailAndPassword(auth, cleanEmail, ownerPassword);
          localStorage.setItem("kfm_owner_email", cleanEmail);
          setOwnerPassword("");
          lastAdminTouchRef.current = Date.now();
          setUnlocked(true);
        } catch (err) {
          const code = err?.code || "";
          if (code === "auth/too-many-requests") {
            setAuthError("Bahut zyada galat tries! Thodi der baad dubara try karein.");
          } else if (code === "auth/operation-not-allowed") {
            setAuthError("Firebase Console mein Email/Password Sign-in enable karein.");
          } else {
            setAuthError("Galat Owner Email ya Password! Kripya sahi details dalein.");
          }
        }
        setAuthLoading(false);
      };

      const getStarsForBill = (bill) => {
        if (starInputs[bill.id] !== undefined) return Math.min(20, Math.max(1, Number(starInputs[bill.id]) || 1));
        if (bill.claimedAmount >= 2000) return Math.min(20, Math.floor(bill.claimedAmount / 1000));
        return 1;
      };

      const handleApprove = async (bill) => {
        if (!verifyCsrfToken(SESSION_CSRF_TOKEN)) return;
        const starsToGive = getStarsForBill(bill);
        if (!starsToGive || starsToGive < 1) {
          return alert("Kam se kam 1 Star select karein.");
        }

        const custRef = doc(db, "customers", bill.phone);
        const snap = await getDoc(custRef);
        const newStars = (snap.exists() ? snap.data().stars || 0 : 0) + starsToGive;

        await updateDoc(custRef, {
          stars: newStars,
          totalApprovedBills: increment(1),
          lastActivityAt: serverTimestamp()
        });

        await updateDoc(doc(db, "bill_submissions", bill.id), {
          status: "approved",
          starsAwarded: starsToGive
        });

        if (
          window.confirm(
            `Approved (+${starsToGive} ${starsToGive > 1 ? "Stars" : "Star"})!\n${bill.customerName} ke ab ${newStars} Stars ho gaye.\nWhatsApp message bhejna hai?`
          )
        ) {
          const starLabel = `+${starsToGive} ${starsToGive > 1 ? "Stars" : "Star"}`;
          const baseMsg =
            newStars >= STARS_FOR_REWARD
              ? `Namaste ${bill.customerName} ji! ${STORE_NAME} mein aapka Invoice #${bill.billNumber} verify ho gaya hai (${starLabel}) aur aapke ${STARS_FOR_REWARD}/${STARS_FOR_REWARD} Stars poore ho gaye hain! Aapka special Offer/Gift ready hai—agli shopping par counter par claim karein.`
              : `Namaste ${bill.customerName} ji! ${STORE_NAME} mein aapka Invoice #${bill.billNumber} verify ho gaya hai (${starLabel}). Total Stars: ${newStars}/${STARS_FOR_REWARD}.`;
          const fullMsg = `${baseMsg}\n\nTo view: ${SITE_URL}`;
          openSafeWhatsApp(bill.phone, fullMsg);
        }
      };

      const handleReject = async (bill) => {
        if (!verifyCsrfToken(SESSION_CSRF_TOKEN)) return;
        const rawReason = window.prompt("Reject reason likhein:", "Bill ₹1000 se kam hai ya photo clear nahi hai");
        if (rawReason === null) return;
        const cleanReason = sanitizeText(rawReason, 120) || "Criteria match nahi hua";
        await updateDoc(doc(db, "bill_submissions", bill.id), {
          status: "rejected",
          rejectReason: cleanReason
        });
      };

      const handleDirectAddStar = async (cust) => {
        if (!verifyCsrfToken(SESSION_CSRF_TOKEN)) return;
        if (!window.confirm(`"${cust.name}" (+91 ${cust.phone}) ke card mein direct +1 Star add karein?`)) return;

        const newStars = (cust.stars || 0) + 1;
        await updateDoc(doc(db, "customers", cust.phone), {
          stars: newStars,
          totalApprovedBills: increment(1),
          lastActivityAt: serverTimestamp()
        });

        if (
          window.confirm(
            `+1 Star add ho gaya! Ab ${cust.name} ke ${newStars} Stars ho gaye.\nWhatsApp par update bhejna hai?`
          )
        ) {
          const baseMsg =
            newStars >= STARS_FOR_REWARD
              ? `Namaste ${cust.name} ji! ${STORE_NAME} mein aapke card par +1 Star add ho gaya hai aur aapke ${STARS_FOR_REWARD}/${STARS_FOR_REWARD} Stars poore ho gaye hain! Aapka special Offer/Gift ready hai—agli shopping par counter par claim karein.`
              : `Namaste ${cust.name} ji! ${STORE_NAME} mein aapke card par +1 Star add ho gaya hai. Total Stars: ${newStars}/${STARS_FOR_REWARD}.`;
          const fullMsg = `${baseMsg}\n\nTo view: ${SITE_URL}`;
          openSafeWhatsApp(cust.phone, fullMsg);
        }
      };

      const handleRedeem = async (cust) => {
        if (!verifyCsrfToken(SESSION_CSRF_TOKEN)) return;
        if (!window.confirm(`${cust.name} ka reward redeem mark karein? (${STARS_FOR_REWARD} stars reset honge)`)) return;
        await updateDoc(doc(db, "customers", cust.phone), {
          stars: Math.max(0, cust.stars - STARS_FOR_REWARD),
          rewardsEarned: increment(1),
          lastActivityAt: serverTimestamp()
        });
      };

      const handleSendReminder = async (cust, waMsg) => {
        if (!verifyCsrfToken(SESSION_CSRF_TOKEN)) return;
        openSafeWhatsApp(cust.phone, waMsg);
        try {
          await updateDoc(doc(db, "customers", cust.phone), {
            lastReminderAt: serverTimestamp()
          });
        } catch (err) {}
      };

      const handleOpenCustomerRecords = (phone) => {
        setSelectedRecordPhone(phone);
        setTab("records");
      };

      const handleNotifyAndCloseDemand = async (req) => {
        if (!verifyCsrfToken(SESSION_CSRF_TOKEN)) return;
        const msg = `Namaste ${req.customerName} ji! ${STORE_NAME} par aapka manga hua item "${req.itemName}" store par aa gaya hai. Aap apni suvidha ke anusaar le sakte hain!\n\nTo view: ${SITE_URL}`;
        openSafeWhatsApp(req.phone, msg);
      };

      const handleDeleteDemand = async (id) => {
        if (!verifyCsrfToken(SESSION_CSRF_TOKEN)) return;
        await deleteDoc(doc(db, "item_requests", id));
      };

      if (!unlocked) {
        return (
          <div className="bg-white text-slate-900 rounded-3xl shadow-xl border p-5 mt-4">
            <StoreLogo className="w-16 h-16 mx-auto mb-3 rounded-2xl" />
            <h2 className="text-lg font-bold text-center">Owner Verification Portal</h2>
            <p className="text-[11px] text-center text-slate-500 mt-0.5">
              🔒 Firebase Server-Verified Login • 15-Min Auto-Lock
            </p>

            {authError && (
              <div className="mt-3 p-2.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-bold text-center">
                {authError}
              </div>
            )}

            <form onSubmit={handleUnlockSubmit} className="mt-4 space-y-3">
              <div>
                <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">
                  Owner Email
                </label>
                <input
                  type="email"
                  autoComplete="username"
                  placeholder="Enter Owner Email"
                  value={ownerEmail}
                  onChange={(e) => setOwnerEmail(e.target.value)}
                  className="w-full px-3.5 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-600"
                  required
                />
              </div>

              <div>
                <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">
                  Owner Password
                </label>
                <input
                  type="password"
                  autoComplete="current-password"
                  placeholder="Enter Owner Password"
                  value={ownerPassword}
                  onChange={(e) => setOwnerPassword(e.target.value)}
                  className="w-full px-3.5 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-600"
                  required
                />
              </div>

              <button
                type="submit"
                disabled={authLoading}
                className="w-full bg-slate-900 active:scale-95 disabled:opacity-50 text-white font-bold py-3.5 rounded-xl text-sm"
              >
                {authLoading ? "Verifying..." : "Unlock Dashboard"}
              </button>
            </form>
          </div>
        );
      }

      const reminderDueCount = customers.filter((c) => getReminderStatus(c).due).length;
      const inactiveCount = customers.filter((c) => {
        const d = getDaysSince(c.lastActivityAt);
        return d !== null && d >= INACTIVE_DAYS_LIMIT;
      }).length;

      const filteredCustomers = (() => {
        let base = customers;
        if (customerFilter === "reminder_7") {
          base = [...customers]
            .filter((c) => getReminderStatus(c).due)
            .sort((a, b) => (getReminderStatus(b).daysSince || 999) - (getReminderStatus(a).daysSince || 999));
        } else if (customerFilter === "near_complete") {
          base = [...customers]
            .filter((c) => c.stars > 0 && c.stars < STARS_FOR_REWARD)
            .sort((a, b) => b.stars - a.stars);
        } else if (customerFilter === "inactive_15") {
          base = [...customers]
            .filter((c) => {
              const d = getDaysSince(c.lastActivityAt);
              return d !== null && d >= INACTIVE_DAYS_LIMIT;
            })
            .sort((a, b) => getDaysSince(b.lastActivityAt) - getDaysSince(a.lastActivityAt));
        }

        const q = searchQuery.trim().toLowerCase();
        if (!q) return base;
        return base.filter(
          (c) =>
            (c.name && c.name.toLowerCase().includes(q)) ||
            (c.phone && c.phone.includes(q))
        );
      })();

      const recordSelectableCustomers = (() => {
        const q = recordSearch.trim().toLowerCase();
        const sorted = [...customers].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
        if (!q) return sorted;
        return sorted.filter(
          (c) =>
            (c.name && c.name.toLowerCase().includes(q)) ||
            (c.phone && c.phone.includes(q))
        );
      })();

      const selectedRecordCustomer = customers.find((c) => c.phone === selectedRecordPhone) || null;

      return (
        <div className="space-y-3.5 mt-1 text-slate-900">
          <div className="flex items-center justify-between bg-emerald-950 text-emerald-100 px-3.5 py-2 rounded-2xl text-[11px] border border-emerald-700/60">
            <span>🛡️ Owner Session (15m Auto-Lock)</span>
            <button
              type="button"
              onClick={() => lockAdminSession(false)}
              className="px-2.5 py-1 rounded-lg bg-amber-400 text-slate-900 font-extrabold text-[10px]"
            >
              🔒 Lock
            </button>
          </div>

          <div className="grid grid-cols-2 gap-1.5 bg-slate-200 p-1.5 rounded-2xl">
            <button
              onClick={() => setTab("pending")}
              className={`py-2.5 px-2 rounded-xl text-xs font-extrabold transition ${
                tab === "pending" ? "bg-white text-emerald-800 shadow" : "text-slate-600"
              }`}
            >
              🧾 Pending ({pendingBills.length})
            </button>
            <button
              onClick={() => setTab("customers")}
              className={`py-2.5 px-2 rounded-xl text-xs font-extrabold transition ${
                tab === "customers" ? "bg-white text-emerald-800 shadow" : "text-slate-600"
              }`}
            >
              👥 Customers ({customers.length})
            </button>
            <button
              onClick={() => setTab("records")}
              className={`py-2.5 px-2 rounded-xl text-xs font-extrabold transition ${
                tab === "records" ? "bg-emerald-700 text-white shadow" : "text-slate-700 bg-white/60"
              }`}
            >
              🗂️ Bill Records
            </button>
            <button
              onClick={() => setTab("demands")}
              className={`py-2.5 px-2 rounded-xl text-xs font-extrabold transition ${
                tab === "demands" ? "bg-white text-emerald-800 shadow" : "text-slate-600"
              }`}
            >
              📦 Demands ({itemRequests.length})
            </button>
          </div>

          {tab === "pending" && (
            <div className="space-y-4">
              {pendingBills.length === 0 ? (
                <div className="bg-white rounded-2xl p-8 text-center border">
                  <p className="font-bold text-slate-700">✅ Koi pending bill nahi hai!</p>
                </div>
              ) : (
                pendingBills.map((b) => {
                  const selectedStars = getStarsForBill(b);
                  return (
                    <div key={b.id} className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                      <div className="p-4 border-b flex justify-between items-start">
                        <div>
                          <h3 className="font-bold">{b.customerName}</h3>
                          <p className="text-xs text-slate-500">+91 {b.phone}</p>
                          <p className="text-[11px] text-slate-400 mt-0.5">📅 {formatDateTime(b.createdAt)}</p>
                        </div>
                        <div className="text-right">
                          <span className="bg-amber-100 text-amber-900 font-bold text-xs px-2.5 py-1 rounded">
                            Invoice #{b.billNumber}
                          </span>
                          {b.claimedAmount > 0 && (
                            <p className="text-sm font-bold text-emerald-700 mt-1">₹{b.claimedAmount}</p>
                          )}
                        </div>
                      </div>

                      {isSafeImageDataUrl(b.imageBase64) && (
                        <div className="bg-slate-900 flex flex-col items-center p-2 relative">
                          <img
                            src={b.imageBase64}
                            loading="lazy"
                            decoding="async"
                            onClick={() =>
                              setZoomData({
                                src: b.imageBase64,
                                title: `${b.customerName} • Invoice #${b.billNumber}`
                              })
                            }
                            className="max-h-60 object-contain cursor-zoom-in"
                          />
                          <button
                            type="button"
                            onClick={() =>
                              setZoomData({
                                src: b.imageBase64,
                                title: `${b.customerName} • Invoice #${b.billNumber}`
                              })
                            }
                            className="mt-2 px-3 py-1.5 rounded-full bg-white/15 active:bg-white/25 text-white text-[11px] font-bold border border-white/20"
                          >
                            🔍 Photo Zoom Karein
                          </button>
                        </div>
                      )}

                      <div className="px-3.5 py-3 bg-emerald-50/70 border-t border-emerald-100 flex items-center justify-between gap-2">
                        <div>
                          <p className="text-xs font-bold text-slate-800">⭐ Kitne Stars?</p>
                          <p className="text-[10px] text-slate-500">₹1000 = 1★ (Excl. Rice)</p>
                        </div>
                        <div className="flex items-center gap-1.5">
                          {[1, 2, 3].map((num) => (
                            <button
                              key={num}
                              type="button"
                              onClick={() => setStarInputs({ ...starInputs, [b.id]: num })}
                              className={`px-2.5 py-2 rounded-lg text-xs font-bold border ${
                                selectedStars === num
                                  ? "bg-amber-400 border-amber-500 text-slate-900 shadow-sm"
                                  : "bg-white border-slate-300 text-slate-600"
                              }`}
                            >
                              {num}★
                            </button>
                          ))}
                          <input
                            type="number"
                            min="1"
                            max="20"
                            value={selectedStars}
                            onChange={(e) => setStarInputs({ ...starInputs, [b.id]: e.target.value })}
                            className="w-12 text-center py-1.5 border border-slate-300 rounded-lg font-bold bg-white"
                            title="Custom Stars"
                          />
                        </div>
                      </div>

                      <div className="p-3 grid grid-cols-2 gap-2.5 bg-slate-50 border-t">
                        <button
                          onClick={() => handleReject(b)}
                          className="py-3 rounded-xl border border-red-200 bg-white text-red-600 font-bold text-sm active:scale-95"
                        >
                          ❌ Reject
                        </button>
                        <button
                          onClick={() => handleApprove(b)}
                          className="py-3 rounded-xl bg-emerald-600 text-white font-bold text-sm active:scale-95"
                        >
                          ✅ Approve (+{selectedStars}★)
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}

          {tab === "customers" && (
            <div className="space-y-3">
              <div className="relative">
                <input
                  type="text"
                  maxLength={40}
                  placeholder="🔍 Naam ya mobile number se search karein..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-3.5 pr-9 py-2.5 bg-white border border-slate-300 rounded-xl font-medium outline-none focus:ring-2 focus:ring-emerald-500"
                />
                {searchQuery && (
                  <button
                    onClick={() => setSearchQuery("")}
                    className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs font-bold p-1"
                  >
                    ✕
                  </button>
                )}
              </div>

              <div className="flex flex-wrap gap-1.5 bg-white p-2 rounded-xl border border-slate-200">
                <button
                  onClick={() => setCustomerFilter("all")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold ${
                    customerFilter === "all"
                      ? "bg-slate-900 text-white"
                      : "bg-slate-100 text-slate-600"
                  }`}
                >
                  All ({customers.length})
                </button>
                <button
                  onClick={() => setCustomerFilter("reminder_7")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold ${
                    customerFilter === "reminder_7"
                      ? "bg-emerald-700 text-white"
                      : "bg-emerald-50 text-emerald-800 border border-emerald-200"
                  }`}
                >
                  🔔 7d Rem ({reminderDueCount})
                </button>
                <button
                  onClick={() => setCustomerFilter("near_complete")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold ${
                    customerFilter === "near_complete"
                      ? "bg-amber-500 text-white"
                      : "bg-amber-50 text-amber-800 border border-amber-200"
                  }`}
                >
                  ⭐ Near 5★
                </button>
                <button
                  onClick={() => setCustomerFilter("inactive_15")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold ${
                    customerFilter === "inactive_15"
                      ? "bg-red-600 text-white"
                      : "bg-red-50 text-red-700 border border-red-200"
                  }`}
                >
                  ⏳ 15d+ ({inactiveCount})
                </button>
              </div>

              {filteredCustomers.length === 0 ? (
                <div className="bg-white rounded-2xl p-6 text-center border text-xs text-slate-500">
                  Koi customer nahi mila.
                </div>
              ) : (
                filteredCustomers.map((c) => {
                  const daysInactive = getDaysSince(c.lastActivityAt);
                  const daysLeft = daysInactive !== null ? Math.max(0, INACTIVE_DAYS_LIMIT - daysInactive) : null;
                  const remStatus = getReminderStatus(c);
                  const starsRemaining = Math.max(0, STARS_FOR_REWARD - (c.stars || 0));

                  const baseWaMsg =
                    starsRemaining === 0
                      ? `Namaste ${c.name} ji! ${STORE_NAME} par aapke ${c.stars}/${STARS_FOR_REWARD} Stars poore ho chuke hain! Apna special Offer/Gift claim karne ke liye jald hi store par aayein.`
                      : starsRemaining === 1
                      ? `Namaste ${c.name} ji! ${STORE_NAME} par aapke ${c.stars}/${STARS_FOR_REWARD} Stars ho gaye hain—Free Gift & Offer unlock karne ke liye sirf 1 Star aur baaki hai! Is hafte ₹1000+ ki shopping par apna card complete karein.`
                      : daysInactive !== null && daysInactive >= INACTIVE_DAYS_LIMIT
                      ? `Namaste ${c.name} ji! ${STORE_NAME} par aapke ${c.stars}/${STARS_FOR_REWARD} Stars hain. Aapko store aaye ${daysInactive} din ho gaye hain—is hafte ₹1000+ ki shopping par agla Star jodein!`
                      : `Namaste ${c.name} ji! ${STORE_NAME} mein aapke ${c.stars}/${STARS_FOR_REWARD} Stars hain. Is hafte ₹1000+ ki shopping par agla Star jodein!`;

                  const waMsg = `${baseWaMsg}\n\nTo view: ${SITE_URL}`;

                  return (
                    <div key={c.phone} className="bg-white rounded-2xl p-3.5 border flex items-center justify-between gap-2">
                      <div className="min-w-0">
                        <div className="flex items-center flex-wrap gap-1.5">
                          <p className="font-bold text-sm truncate">{c.name}</p>
                          <span className="text-xs bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full">
                            {c.stars}/{STARS_FOR_REWARD} ★
                          </span>
                          {remStatus.due ? (
                            <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">
                              🔔 Rem Due
                            </span>
                          ) : (
                            <span className="text-[10px] bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full">
                              Next: {remStatus.nextInDays}d
                            </span>
                          )}
                          {daysInactive !== null && (
                            daysInactive >= INACTIVE_DAYS_LIMIT ? (
                              <span className="text-[10px] bg-red-100 text-red-700 font-bold px-2 py-0.5 rounded-full">
                                ⚠️ {daysInactive}d
                              </span>
                            ) : (
                              <span className="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">
                                ⏳ {daysLeft}d
                              </span>
                            )
                          )}
                        </div>
                        <p className="text-xs text-slate-500 mt-1">
                          {c.phone} • Bills: {c.totalApprovedBills || 0} • Gifts: {c.rewardsEarned || 0}
                        </p>
                      </div>

                      <div className="flex items-center gap-1 shrink-0">
                        {c.stars >= STARS_FOR_REWARD && (
                          <button
                            onClick={() => handleRedeem(c)}
                            className="bg-amber-500 text-white text-[11px] font-bold px-2 py-2.5 rounded-xl active:scale-95"
                          >
                            Redeem
                          </button>
                        )}
                        <button
                          onClick={() => handleOpenCustomerRecords(c.phone)}
                          className="p-2.5 rounded-xl bg-slate-100 active:bg-slate-200 text-slate-700 border border-slate-300 text-xs font-bold"
                          title="Date-by-Date Bills Dekhein"
                        >
                          🗂️
                        </button>
                        <button
                          onClick={() => handleDirectAddStar(c)}
                          className="px-2 py-2.5 rounded-xl bg-amber-100 active:bg-amber-200 text-amber-900 border border-amber-300 text-xs font-extrabold"
                          title="Direct +1 Star Add Karein"
                        >
                          +1★
                        </button>
                        <button
                          onClick={() => handleSendReminder(c, waMsg)}
                          className={`px-2.5 py-2.5 rounded-xl text-xs font-bold border active:scale-95 ${
                            remStatus.due
                              ? "bg-emerald-600 text-white border-emerald-700 shadow-sm"
                              : "bg-emerald-50 text-emerald-700 border-emerald-200"
                          }`}
                          title="Send WhatsApp & Reset 7-Day Timer"
                        >
                          💬
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}

          {tab === "records" && (
            <div className="space-y-3">
              <div className="bg-white rounded-2xl p-4 border shadow-sm space-y-3">
                <div>
                  <h3 className="font-extrabold text-sm text-slate-800">
                    🗂️ Customer-Wise Date-by-Date Bill Records
                  </h3>
                  <p className="text-[11px] text-slate-500">
                    Customer select karein—unke sabhi stored bills aur photos date ke hisaab se dikhenge
                  </p>
                </div>

                <div className="space-y-2">
                  <input
                    type="text"
                    maxLength={40}
                    placeholder="🔍 Customer ka naam ya mobile number..."
                    value={recordSearch}
                    onChange={(e) => setRecordSearch(e.target.value)}
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl font-medium outline-none focus:bg-white focus:border-emerald-500"
                  />

                  <select
                    value={selectedRecordPhone}
                    onChange={(e) => setSelectedRecordPhone(e.target.value)}
                    className="w-full px-3.5 py-3 bg-white border-2 border-emerald-300 rounded-xl font-bold text-slate-800 outline-none focus:border-emerald-600"
                  >
                    <option value="">-- Customer Select Karein ({recordSelectableCustomers.length}) --</option>
                    {recordSelectableCustomers.map((c) => (
                      <option key={c.phone} value={c.phone}>
                        {c.name} (+91 {c.phone}) — {c.stars}/{STARS_FOR_REWARD} ★
                      </option>
                    ))}
                  </select>
                </div>

                {!selectedRecordPhone && recordSelectableCustomers.length > 0 && (
                  <div className="pt-1">
                    <p className="text-[10px] font-bold text-slate-400 uppercase mb-1.5">Ya neeche se tap karein:</p>
                    <div className="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto">
                      {recordSelectableCustomers.slice(0, 15).map((c) => (
                        <button
                          key={c.phone}
                          type="button"
                          onClick={() => setSelectedRecordPhone(c.phone)}
                          className="px-2.5 py-2 rounded-xl bg-emerald-50 active:bg-emerald-100 text-emerald-900 border border-emerald-200 text-xs font-semibold"
                        >
                          {c.name} ({c.phone.slice(-4)})
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              {selectedRecordCustomer && (
                <div className="space-y-3">
                  <div className="bg-gradient-to-r from-emerald-800 to-teal-700 text-white rounded-2xl p-4 flex items-center justify-between">
                    <div>
                      <p className="text-[10px] uppercase tracking-wider text-amber-300 font-bold">Selected Customer</p>
                      <h4 className="font-extrabold text-base">{selectedRecordCustomer.name}</h4>
                      <p className="text-xs text-emerald-100">
                        +91 {selectedRecordCustomer.phone} • Stars: {selectedRecordCustomer.stars}/{STARS_FOR_REWARD} ★
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setSelectedRecordPhone("")}
                      className="px-3 py-2 rounded-xl bg-white/15 active:bg-white/25 text-xs font-bold"
                    >
                      Change
                    </button>
                  </div>

                  {loadingRecords ? (
                    <div className="bg-white rounded-2xl p-6 text-center border text-xs text-slate-500">
                      Bills load ho rahe hain...
                    </div>
                  ) : customerRecordBills.length === 0 ? (
                    <div className="bg-white rounded-2xl p-6 text-center border text-xs text-slate-500">
                      Is customer ka abhi tak koi bill upload record nahi hai.
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <p className="text-xs font-extrabold text-slate-700 px-1">
                        📅 Date-by-Date Bills ({customerRecordBills.length} Total)
                      </p>
                      {customerRecordBills.map((b) => {
                        const awarded = b.starsAwarded || 1;
                        return (
                          <div key={b.id} className="bg-white rounded-2xl border shadow-sm overflow-hidden">
                            <div className="p-3.5 flex items-start justify-between gap-2 border-b bg-slate-50/70">
                              <div>
                                <div className="flex items-center gap-2 flex-wrap">
                                  <span className="bg-slate-900 text-white text-xs font-extrabold px-2.5 py-0.5 rounded-lg">
                                    Invoice #{b.billNumber}
                                  </span>
                                  {b.claimedAmount > 0 && (
                                    <span className="text-xs font-extrabold text-emerald-700">
                                      ₹{b.claimedAmount}
                                    </span>
                                  )}
                                </div>
                                <p className="text-xs font-semibold text-slate-600 mt-1">
                                  📅 {formatDateTime(b.createdAt)}
                                </p>
                                {b.status === "rejected" && b.rejectReason && (
                                  <p className="text-[11px] text-red-600 mt-0.5">Reason: {b.rejectReason}</p>
                                )}
                              </div>

                              <span
                                className={`text-[11px] font-extrabold px-2.5 py-1 rounded-full shrink-0 ${
                                  b.status === "pending"
                                    ? "bg-amber-200 text-amber-900"
                                    : b.status === "approved"
                                    ? "bg-emerald-600 text-white"
                                    : "bg-red-100 text-red-800"
                                }`}
                              >
                                {b.status === "pending"
                                  ? "⏳ Pending"
                                  : b.status === "approved"
                                  ? `⭐ +${awarded} ${awarded > 1 ? "Stars" : "Star"}`
                                  : "❌ Rejected"}
                              </span>
                            </div>

                            {isSafeImageDataUrl(b.imageBase64) ? (
                              <div className="bg-slate-900 p-2.5 flex flex-col items-center">
                                <img
                                  src={b.imageBase64}
                                  loading="lazy"
                                  decoding="async"
                                  onClick={() =>
                                    setZoomData({
                                      src: b.imageBase64,
                                      title: `${selectedRecordCustomer.name} • Invoice #${b.billNumber} (${formatDateTime(b.createdAt)})`
                                    })
                                  }
                                  alt={`Invoice ${b.billNumber}`}
                                  className="max-h-60 object-contain rounded cursor-zoom-in"
                                />
                                <button
                                  type="button"
                                  onClick={() =>
                                    setZoomData({
                                      src: b.imageBase64,
                                      title: `${selectedRecordCustomer.name} • Invoice #${b.billNumber} (${formatDateTime(b.createdAt)})`
                                    })
                                  }
                                  className="mt-2 px-3.5 py-2 rounded-full bg-amber-400 text-slate-900 text-xs font-extrabold shadow active:scale-95"
                                >
                                  🔍 Full Screen Zoom Karein
                                </button>
                              </div>
                            ) : (
                              <div className="p-3 text-center text-[11px] text-slate-400 bg-slate-50">
                                (Purana bill — photo archived)
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {tab === "demands" && (
            <div className="space-y-2.5">
              {itemRequests.length === 0 ? (
                <div className="bg-white rounded-2xl p-8 text-center border text-xs text-slate-500">
                  Abhi kisi customer ki koi item demand pending nahi hai.
                </div>
              ) : (
                itemRequests.map((req) => (
                  <div key={req.id} className="bg-white rounded-2xl p-4 border flex items-center justify-between gap-2">
                    <div>
                      <p className="font-extrabold text-sm text-slate-800">📦 {req.itemName}</p>
                      <p className="text-xs text-slate-500 mt-0.5">
                        {req.customerName} • +91 {req.phone}
                      </p>
                    </div>
                    <div className="flex items-center gap-1.5 shrink-0">
                      <button
                        onClick={() => handleNotifyAndCloseDemand(req)}
                        className="px-3 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold active:scale-95"
                        title="WhatsApp par batayein ki samaan aa gaya hai"
                      >
                        💬 Notify
                      </button>
                      <button
                        onClick={() => handleDeleteDemand(req.id)}
                        className="p-2.5 rounded-xl bg-slate-100 active:bg-slate-200 text-slate-700 text-xs font-bold"
                        title="Done / Fulfilled"
                      >
                        ✅
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          )}

          {zoomData && (
            <BillZoomModal
              src={zoomData.src}
              title={zoomData.title}
              onClose={() => setZoomData(null)}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
