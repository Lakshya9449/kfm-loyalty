<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="apple-mobile-web-app-title" content="KFM Star Card" />

  <!-- Security Headers (CSP, Referrer Policy, No-Sniff, HTTPS Upgrade) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com wss://*.firebaseio.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests;" />

  <title>Khandelwal Food Mart - Scan & Earn</title>

  <!-- Speed Boost: Preconnect to CDNs & Firebase Servers -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />

  <!-- Enforce HTTPS & Disable Production Debug Logs -->
  <script>
    (function () {
      if (
        window.location.protocol === "http:" &&
        window.location.hostname !== "localhost" &&
        window.location.hostname !== "127.0.0.1"
      ) {
        window.location.replace("https://" + window.location.host + window.location.pathname + window.location.search);
      }
      if (window.location.hostname.endsWith("github.io")) {
        const noop = function () {};
        console.log = noop;
        console.debug = noop;
        console.info = noop;
        console.warn = noop;
      }
    })();
  </script>

  <!-- App Favicon & Home Screen Icons (logo.png) -->
  <link rel="icon" type="image/png" href="./logo.png" />
  <link rel="apple-touch-icon" href="./logo.png" />

  <!-- Dynamic PWA Manifest for Android Add to Home Screen -->
  <script>
    (function () {
      try {
        const logoUrl = new URL("logo.png", window.location.href).href;
        const manifest = {
          name: "Khandelwal Food Mart - Scan & Earn",
          short_name: "KFM Star Card",
          start_url: "./",
          display: "standalone",
          background_color: "#065f46",
          theme_color: "#047857",
          icons: [
            { src: logoUrl, sizes: "192x192", type: "image/png", purpose: "any maskable" },
            { src: logoUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }
          ]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
        const link = document.createElement("link");
        link.rel = "manifest";
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
      } catch (e) {}
    })();
  </script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(4deg); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(7px) rotate(-4deg); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes shimmerGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.45); }
      50% { box-shadow: 0 0 22px rgba(251, 191, 36, 0.85); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .animate-float { animation: floatSlow 3.6s ease-in-out infinite; }
    .animate-float-rev { animation: floatReverse 4.2s ease-in-out infinite; }
    .animate-pop { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .star-glow { animation: shimmerGlow 2.2s ease-in-out infinite; }

    /* Instant Splash Screen (Renders in 0ms before React boots) */
    .kfm-splash {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #065f46 0%, #0f766e 55%, #064e3b 100%);

    }
    .kfm-splash img {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      border: 2px solid rgba(252, 211, 77, 0.7);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      margin-bottom: 14px;
      object-fit: cover;
    }
    .kfm-splash-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .kfm-splash-sub {
      font-size: 12px;
      color: #fde68a;
      font-weight: 600;
      margin-top: 4px;
    }
    .kfm-splash-dots {
      display: flex;
      gap: 6px;
      margin-top: 18px;
    }
    .kfm-splash-dots span {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #fbbf24;
      animation: pulseDot 1s infinite ease-in-out;
    }
    .kfm-splash-dots span:nth-child(2) { animation-delay: 0.2s; }
    .kfm-splash-dots span:nth-child(3) { animation-delay: 0.4s; }

    /* Mobile-First Festive Grocery & Star Background */
    .festive-bg {
      background-color: #fffbeb;
      background-image:
        radial-gradient(circle at 12% 10%, rgba(251, 191, 36, 0.32) 0px, transparent 42%),
        radial-gradient(circle at 88% 14%, rgba(16, 185, 129, 0.26) 0px, transparent 44%),
        radial-gradient(circle at 85% 85%, rgba(249, 115, 22, 0.22) 0px, transparent 46%),
        radial-gradient(circle at 15% 88%, rgba(20, 184, 166, 0.26) 0px, transparent 44%),
        url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23059669' fill-opacity='0.065'%3E%3Cpath d='M40 14l4.5 9.2 10.1 1.5-7.3 7.1 1.7 10.1L40 37.1l-9 4.8 1.7-10.1-7.3-7.1 10.1-1.5L40 14zm0 44a6 6 0 1 1 0 12 6 6 0 0 1 0-12zM14 54l3 6 6.6 1-4.8 4.6 1.1 6.6L14 69l-5.9 3.2 1.1-6.6-4.8-4.6 6.6-1 3-6zm52 0l3 6 6.6 1-4.8 4.6 1.1 6.6L66 69l-5.9 3.2 1.1-6.6-4.8-4.6 6.6-1 3-6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
  </style>
</head>
<body class="festive-bg text-slate-900 font-sans min-h-screen relative overflow-x-hidden">
  <!-- Instant Splash Screen until React mounts -->
  <div id="root">
    <div class="kfm-splash">
      <img src="./logo.png" alt="KFM Logo" onerror="this.style.display='none'" />
      <div class="kfm-splash-title">KHANDELWAL FOOD MART</div>
      <div class="kfm-splash-sub">✨ Scan &amp; Earn Star Club</div>
      <div class="kfm-splash-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
      collection, addDoc, query, where,
      onSnapshot, serverTimestamp, increment, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 1. FIREBASE CONFIG (Connected + Fast Parallel Auth)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDqy3SmMrTyO1glyairloHUnVso306Ow2o",
      authDomain: "kfm-loyalty.firebaseapp.com",
      projectId: "kfm-loyalty",
      storageBucket: "kfm-loyalty.firebasestorage.app",
      messagingSenderId: "388917961664",
      appId: "1:388917961664:web:2eca6ac24b0889a4845e25"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Single shared promise so auth never triggers duplicate round-trips
    let authInitPromise = null;
    const ensureCustomerAuth = () => {
      if (auth.currentUser) return Promise.resolve(auth.currentUser);
      if (!authInitPromise) {
        authInitPromise = new Promise((resolve, reject) => {
          const unsub = onAuthStateChanged(auth, async (user) => {
            if (user) {
              unsub();
              resolve(user);
            } else {
              try {
                const cred = await signInAnonymously(auth);
                unsub();
                resolve(cred.user);
              } catch (err) {
                unsub();
                authInitPromise = null;
                reject(err);
              }
            }
          });
        });
      }
      return authInitPromise;
    };

    // Start warming up Firebase Auth immediately on script load
    ensureCustomerAuth().catch(() => {});

    // Check if current session is authenticated as Owner (Email/Password)
    const isCurrentUserOwner = () => {
      const user = auth.currentUser;
      if (!user || user.isAnonymous) return false;
      return user.providerData?.some((p) => p.providerId === "password");
    };

    // ==========================================
    // 2. STORE & SECURITY SETTINGS
    // ==========================================
    const STORE_NAME = "KHANDELWAL FOOD MART";
    const SITE_URL = "https://lakshya9449.github.io/kfm-loyalty/";
    const GOOGLE_REVIEW_URL = "https://maps.app.goo.gl/iGBTXhCznfrmEtUz9";
    const MIN_BILL_AMOUNT = 1000;
    const MAX_BILL_AMOUNT = 500000;
    const STARS_FOR_REWARD = 5;

    const ADMIN_IDLE_TIMEOUT_MS = 15 * 60 * 1000; // 15-minute auto session lock

    // Upload & Rate-Limit Rules
    const ALLOWED_IMAGE_TYPES = ["image/jpeg", "image/jpg", "image/png", "image/webp"];
    const MAX_RAW_FILE_BYTES = 8 * 1024 * 1024;   // 8 MB max raw upload
    const MAX_STORED_DATAURL_CHARS = 650000;      // ~480 KB max compressed image
    const BILL_COOLDOWN_MS = 30 * 1000;           // 30s between bill uploads
    const DEMAND_COOLDOWN_MS = 20 * 1000;         // 20s between item requests

    const INACTIVE_DAYS_LIMIT = 15;
    const REMINDER_DAYS_CYCLE = 7;

    // ==========================================
    // 3. SECURITY HELPERS (XSS, CSRF, VALIDATION)
    // ==========================================
    const getSessionCsrfToken = () => {
      let token = sessionStorage.getItem("kfm_csrf_token");
      if (!token) {
        const arr = new Uint8Array(24);
        window.crypto.getRandomValues(arr);
        token = Array.from(arr, (b) => b.toString(16).padStart(2, "0")).join("");
        sessionStorage.setItem("kfm_csrf_token", token);
      }
      return token;
    };
    const SESSION_CSRF_TOKEN = getSessionCsrfToken();

    const verifyCsrfToken = (token) => Boolean(token && token === SESSION_CSRF_TOKEN);

    const sanitizeText = (str, maxLen = 60) => {
      if (typeof str !== "string") return "";
      return str
        .replace(/[<>"'`\\]/g, "")
        .replace(/javascript:|data:|vbscript:|on\w+=/gi, "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, maxLen);
    };

    const isSafeImageDataUrl = (url) => {
      if (typeof url !== "string") return false;
      return /^data:image\/(jpeg|jpg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(url);
    };

    const isValidIndianPhone = (phone) => /^[6-9]\d{9}$/.test(phone);

    const openSafeWhatsApp = (phone, message) => {
      const clean = String(phone || "").replace(/\D/g, "").slice(-10);
      if (!isValidIndianPhone(clean)) return;
      const url = `https://wa.me/91${clean}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank", "noopener,noreferrer");
    };

    // Instant Local Cache Helpers for 0ms Returning Customer Load
    const readCachedCustomer = (phone) => {
      try {
        if (!isValidIndianPhone(phone)) return null;
        const raw = localStorage.getItem(`kfm_cust_cache_${phone}`);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    };

    const writeCachedCustomer = (phone, data) => {
      try {
        if (!isValidIndianPhone(phone) || !data) return;
        localStorage.setItem(
          `kfm_cust_cache_${phone}`,
          JSON.stringify({
            phone: data.phone,
            name: data.name,
            stars: data.stars || 0,
            totalApprovedBills: data.totalApprovedBills || 0,
            rewardsEarned: data.rewardsEarned || 0
          })
        );
      } catch (e) {}
    };

    // Reusable Store Logo Component
    function StoreLogo({ className = "w-10 h-10" }) {
      const [imgError, setImgError] = useState(false);

      if (imgError) {
        return (
          <div className={`${className} rounded-xl bg-amber-400 text-slate-900 flex items-center justify-center text-xl shadow-md shrink-0`}>
            ⭐
          </div>
        );
      }

      return (
        <img
          src="./logo.png"
          alt="KFM Loyalty Logo"
          decoding="async"
          onError={() => setImgError(true)}
          className={`${className} rounded-xl object-cover shadow-md border border-amber-300/60 bg-emerald-950 shrink-0`}
        />
      );
    }

    // Secure Image Validator & Compressor
    const compressBillImage = (file) => {
      return new Promise((resolve, reject) => {
        if (!file || !ALLOWED_IMAGE_TYPES.includes(file.type)) {
          return reject(new Error("Sirf JPG, PNG ya WEBP image file hi allowed hai."));
        }
        if (file.size > MAX_RAW_FILE_BYTES) {
          return reject(new Error("File size 8 MB se kam honi chahiye."));
        }

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 900;
            const scale = MAX_WIDTH / img.width;
            canvas.width = img.width > MAX_WIDTH ? MAX_WIDTH : img.width;
            canvas.height = img.width > MAX_WIDTH ? img.height * scale : img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            let compressed = canvas.toDataURL("image/jpeg", 0.65);
            if (compressed.length > MAX_STORED_DATAURL_CHARS) {
              compressed = canvas.toDataURL("image/jpeg", 0.45);
            }
            if (compressed.length > MAX_STORED_DATAURL_CHARS || !isSafeImageDataUrl(compressed)) {
              return reject(new Error("Image bahut badi ya invalid hai, chhoti photo chunein."));
            }
            resolve(compressed);
          };
          img.onerror = () => reject(new Error("Corrupt ya invalid image file."));
        };
        reader.onerror = () => reject(new Error("File read nahi ho payi."));
      });
    };

    const toMillisSafe = (ts) => {
      if (!ts) return null;
      if (ts.toMillis) return ts.toMillis();
      if (ts.seconds) return ts.seconds * 1000;
      return null;
    };

    const formatDateTime = (ts) => {
      const ms = toMillisSafe(ts);
      if (!ms) return "Date pending";
      const d = new Date(ms);
      const datePart = d.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
      const timePart = d.toLocaleTimeString("en-IN", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
      return `${datePart} • ${timePart}`;
    };

    const getDaysSince = (ts) => {
      const ms = toMillisSafe(ts);
      if (!ms) return null;
      return Math.floor((Date.now() - ms) / (1000 * 60 * 60 * 24));
    };

    const getReminderStatus = (cust) => {
      const lastActMs = toMillisSafe(cust.lastActivityAt) || 0;
      const lastRemMs = toMillisSafe(cust.lastReminderAt) || 0;
      const latestTouchMs = Math.max(lastActMs, lastRemMs);

      if (!latestTouchMs) {
        return { due: true, daysSince: null, nextInDays: 0 };
      }

      const daysPassed = Math.floor((Date.now() - latestTouchMs) / (1000 * 60 * 60 * 24));
      return {
        due: daysPassed >= REMINDER_DAYS_CYCLE,
        daysSince: daysPassed,
        nextInDays: Math.max(0, REMINDER_DAYS_CYCLE - daysPassed)
      };
    };

    // ==========================================
    // INTERACTIVE FULL-SCREEN BILL PHOTO ZOOM MODAL
    // ==========================================
    function BillZoomModal({ src, title, onClose }) {
      const [zoomed, setZoomed] = useState(false);

      if (!src || !isSafeImageDataUrl(src)) return null;

      return (
        <div
          onClick={onClose}
          className="fixed inset-0 bg-black/95 z-50 flex flex-col"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="flex items-center justify-between px-4 py-3 bg-slate-900/90 border-b border-slate-700 text-white shrink-0"
          >
            <div className="min-w-0 pr-2">
              <p className="text-xs font-extrabold truncate">{title || "Bill Receipt Photo"}</p>
              <p className="text-[10px] text-slate-400">
                {zoomed ? "Scroll karke bill check karein" : "Zoom button ya photo par tap karein"}
              </p>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <button
                type="button"
                onClick={() => setZoomed((z) => !z)}
                className="px-3 py-1.5 rounded-xl bg-amber-400 text-slate-900 font-extrabold text-xs shadow"
              >
                {zoomed ? "🔎 Fit Screen" : "🔍 Zoom In (2x)"}
              </button>
              <button
                type="button"
                onClick={onClose}
                className="px-3 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs"
              >
                ✕ Close
              </button>
            </div>
          </div>

          <div
            onClick={(e) => e.stopPropagation()}
            className={`flex-1 overflow-auto flex ${
              zoomed ? "items-start justify-start p-4" : "items-center justify-center p-3"
            }`}
          >
            <img
              src={src}
              onClick={() => setZoomed((z) => !z)}
              alt="Bill Receipt"
              style={
                zoomed
                  ? { width: "185%", maxWidth: "none", cursor: "zoom-out" }
                  : { maxHeight: "84vh", maxWidth: "100%", cursor: "zoom-in" }
              }
              className="rounded-lg shadow-2xl transition-all duration-200 select-none"
            />
          </div>
        </div>
      );
    }

    // ==========================================
    // MOBILE-OPTIMIZED DECORATIVE BACKGROUND
    // ==========================================
    function FestiveBackgroundDecor() {

        <div className="fixed inset-0 pointer-events-none overflow-hidden z-0 select-none" aria-hidden="true">

          <div className="absolute -bottom-16 right-0 w-60 h-60 rounded-full bg-teal-300/25 blur-3xl" />

          <div className="absolute top-16 left-2 w-9 h-9 rounded-xl bg-white/80 backdrop-blur-sm shadow-sm border border-amber-200 flex items-center justify-center text-lg animate-float opacity-85">
            🧺
          </div>
          <div className="absolute top-20 right-2 w-9 h-9 rounded-full bg-white/80 backdrop-blur-sm shadow-sm border border-emerald-200 flex items-center justify-center text-base animate-float-rev opacity-85">

          </div>

          </div>

          </div>

    // ==========================================
    // MAIN APP
    // ==========================================
    function App() {
      const isAdminUrl = new URLSearchParams(window.location.search).get("admin") === "true";
      const [mode, setMode] = useState(isAdminUrl ? "admin" : "customer");
      const tapCountRef = useRef(0);
      const tapTimerRef = useRef(null);

      const handleTitleTap = () => {
        tapCountRef.current += 1;
        if (tapTimerRef.current) clearTimeout(tapTimerRef.current);

        if (tapCountRef.current >= 3) {
          tapCountRef.current = 0;
          setMode("admin");
          return;
        }

        tapTimerRef.current = setTimeout(() => {
          tapCountRef.current = 0;
        }, 700);
      };

      return (
        <div className="min-h-screen pb-14 relative">
          {mode === "customer" && <FestiveBackgroundDecor />}

          <header className="bg-gradient-to-r from-emerald-800 via-teal-700 to-emerald-800 text-white px-4 py-2.5 shadow-lg flex items-center justify-between sticky top-0 z-30 select-none border-b border-amber-300/30">
            <div onClick={handleTitleTap} className="cursor-pointer flex items-center gap-2.5">
              <StoreLogo className="w-10 h-10" />
              <div>
                <h1 className="font-extrabold text-sm sm:text-base tracking-wide leading-tight">{STORE_NAME}</h1>
                <p className="text-[10px] text-amber-200 font-semibold tracking-wider uppercase">
                  ✨ Scan & Earn Star Club
                </p>
              </div>
            </div>
            {mode === "admin" && (
              <button
                onClick={() => setMode("customer")}
                className="text-xs bg-emerald-950/80 hover:bg-emerald-950 px-3 py-1.5 rounded-full border border-emerald-500 font-medium"
              >
                ← Customer View
              </button>
            )}
          </header>

          <main className={`${mode === "customer" ? "max-w-md" : "max-w-xl"} mx-auto px-3.5 py-3 relative z-10`}>
            {mode === "customer" ? <CustomerPortal /> : <AdminPortal />}
          </main>
        </div>
      );
    }

    // ==========================================
    // CUSTOMER PORTAL (0MS INSTANT CACHE + PARALLEL SYNC)
    // ==========================================
    function CustomerPortal() {
      const initialPhone = (() => {
        const saved = localStorage.getItem("kfm_phone") || "";
        return isValidIndianPhone(saved) ? saved : "";
      })();

      const [phone, setPhone] = useState(initialPhone);
      const [name, setName] = useState("");
      // Load cached Star Card immediately in 0ms for returning users
      const [customer, setCustomer] = useState(() => readCachedCustomer(initialPhone));
      const [isNewUser, setIsNewUser] = useState(false);
      const [loading, setLoading] = useState(false);

      const [billNumber, setBillNumber] = useState("");
      const [claimedAmount, setClaimedAmount] = useState("");
      const [previewImage, setPreviewImage] = useState(null);
      const [uploading, setUploading] = useState(false);
      const [msg, setMsg] = useState(null);
      const [myBills, setMyBills] = useState([]);
      const [zoomBillData, setZoomBillData] = useState(null);

      // Missing Item Request state
      const [itemRequest, setItemRequest] = useState("");
      const [requestSending, setRequestSending] = useState(false);
      const [requestSentMsg, setRequestSentMsg] = useState("");

      // Save Card on Home Screen state
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [showHomeScreenModal, setShowHomeScreenModal] = useState(false);
      const [hideInstallBanner, setHideInstallBanner] = useState(() => localStorage.getItem("kfm_hide_install") === "1");

      // Joyful Attention Popups
      const [activePopup, setActivePopup] = useState(null);
      const shownEventsRef = useRef(new Set());
      const unsubRefs = useRef([]);

      useEffect(() => {
        if (isValidIndianPhone(phone)) {
          loadCustomer(phone, Boolean(readCachedCustomer(phone)));
        }

        const handleBeforeInstall = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener("beforeinstallprompt", handleBeforeInstall);
        return () => {
          window.removeEventListener("beforeinstallprompt", handleBeforeInstall);
          unsubRefs.current.forEach((fn) => fn && fn());
        };
      }, []);

      const handleSaveHomeScreen = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const choice = await deferredPrompt.userChoice;
          if (choice.outcome === "accepted") {
            setDeferredPrompt(null);
            setHideInstallBanner(true);
            localStorage.setItem("kfm_hide_install", "1");
          }
        } else {
          setShowHomeScreenModal(true);
        }
      };

      const loadCustomer = async (cleanPhone, silentBackground = false) => {
        if (!isValidIndianPhone(cleanPhone)) return;
        if (!silentBackground) setLoading(true);

        try {
          await ensureCustomerAuth();
          const custRef = doc(db, "customers", cleanPhone);
          const snap = await getDoc(custRef);

          if (!snap.exists()) {
            localStorage.removeItem(`kfm_cust_cache_${cleanPhone}`);
            setCustomer(null);
            setIsNewUser(true);
            setLoading(false);
            return;
          }

          localStorage.setItem("kfm_phone", cleanPhone);
          setIsNewUser(false);
          const initialData = snap.data();
          setCustomer(initialData);
          writeCachedCustomer(cleanPhone, initialData);
          setLoading(false);

          // Clean up any older listeners before attaching new ones
          unsubRefs.current.forEach((fn) => fn && fn());
          unsubRefs.current = [];

          // Parallel real-time listeners for customer doc + bill history
          const unsubCust = onSnapshot(custRef, (d) => {
            if (d.exists()) {
              const data = d.data();
              setCustomer(data);
              writeCachedCustomer(cleanPhone, data);

              const rewardKey = `reward_unlocked_${cleanPhone}_${data.stars}_${data.rewardsEarned || 0}`;
              if (
                data.stars >= STARS_FOR_REWARD &&
                !localStorage.getItem(rewardKey) &&
                !shownEventsRef.current.has(rewardKey)
              ) {
                shownEventsRef.current.add(rewardKey);
                localStorage.setItem(rewardKey, "1");
                setActivePopup({
                  type: "reward_complete",
                  name: sanitizeText(data.name, 40),
                  stars: data.stars
                });
              }
            } else {
              localStorage.removeItem("kfm_phone");
              localStorage.removeItem(`kfm_cust_cache_${cleanPhone}`);
              setCustomer(null);
            }
          });

          const q = query(collection(db, "bill_submissions"), where("phone", "==", cleanPhone));
          const unsubBills = onSnapshot(q, (qSnap) => {
            const list = [];
            qSnap.forEach((d) => list.push({ id: d.id, ...d.data() }));
            list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            setMyBills(list);

            const latestApproved = list.find((b) => b.status === "approved");
            if (latestApproved) {
              const seenKey = `kfm_seen_approved_${latestApproved.id}`;
              if (!localStorage.getItem(seenKey) && !shownEventsRef.current.has(seenKey)) {
                shownEventsRef.current.add(seenKey);
                localStorage.setItem(seenKey, "1");
                const awarded = latestApproved.starsAwarded || 1;
                setActivePopup((prev) =>
                  prev?.type === "reward_complete"
                    ? prev
                    : {
                        type: "star_approved",
                        billNumber: sanitizeText(latestApproved.billNumber, 20),
                        starsAwarded: awarded
                      }
                );
              }
            }
          });

          unsubRefs.current = [unsubCust, unsubBills];
        } catch (err) {
          setLoading(false);
          if (!silentBackground) {
            alert("Firebase Auth/Rules check karein: Anonymous sign-in enable hona zaroori hai.");
          }
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!verifyCsrfToken(SESSION_CSRF_TOKEN)) return;

        const cleanPhone = phone.replace(/\D/g, "").slice(-10);
        if (!isValidIndianPhone(cleanPhone)) {
          return alert("Valid 10-digit Indian mobile number dalein (6-9 se shuru).");
        }

        if (isNewUser) {
          const cleanName = sanitizeText(name, 40).replace(/[^a-zA-Z\s.]/g, "").trim();
          if (cleanName.length < 2) {
            return alert("Apna sahi naam likhein (kam se kam 2 letters).");
          }
          setLoading(true);
          try {
            await ensureCustomerAuth();
            const newProfile = {
              phone: cleanPhone,
              name: cleanName,
              stars: 0,
              totalApprovedBills: 0,
              rewardsEarned: 0,
              lastActivityAt: serverTimestamp()
            };
            await setDoc(doc(db, "customers", cleanPhone), newProfile);
            writeCachedCustomer(cleanPhone, newProfile);
            await loadCustomer(cleanPhone);
          } catch (err) {
            setLoading(false);
            alert("Account create nahi ho paya. Firebase Anonymous Auth aur Rules check karein.");
          }
        } else {
          await loadCustomer(cleanPhone);
        }
      };

      const handleFile = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const compressed = await compressBillImage(file);
          setPreviewImage(compressed);
          setMsg(null);
        } catch (err) {
          e.target.value = "";
          setPreviewImage(null);
          setMsg({ type: "err", text: `⚠️ ${err.message}` });
        }
      };

      const handleBillSubmit = async (e) => {
        e.preventDefault();
        if (!verifyCsrfToken(SESSION_CSRF_TOKEN)) return;

        const lastUploadMs = Number(localStorage.getItem("kfm_last_bill_upload_ms") || 0);
        const elapsed = Date.now() - lastUploadMs;
        if (elapsed < BILL_COOLDOWN_MS) {
          const waitSec = Math.ceil((BILL_COOLDOWN_MS - elapsed) / 1000);
          return setMsg({ type: "err", text: `⏳ Kripya ${waitSec} second ruk kar agla bill upload karein.` });
        }

        const cleanBillNo = sanitizeText(billNumber, 20)
          .toUpperCase()
          .replace(/[^A-Z0-9\-\/]/g, "");
        const amt = claimedAmount ? Math.floor(Number(claimedAmount)) : 0;

        if (!cleanBillNo || cleanBillNo.length < 2) {
          return setMsg({ type: "err", text: "Valid Invoice / Bill Number likhein (letters/numbers only)." });
        }
        if (claimedAmount && (isNaN(amt) || amt < MIN_BILL_AMOUNT || amt > MAX_BILL_AMOUNT)) {
          return setMsg({
            type: "err",
            text: `Bill amount ₹${MIN_BILL_AMOUNT} se ₹${MAX_BILL_AMOUNT.toLocaleString("en-IN")} ke beech hona chahiye.`
          });
        }
        if (!previewImage || !isSafeImageDataUrl(previewImage)) {
          return setMsg({ type: "err", text: "Valid bill image (JPG/PNG/WEBP) upload karein." });
        }

        setUploading(true);
        setMsg(null);

        try {
          await ensureCustomerAuth();
          const dupQ = query(collection(db, "bill_submissions"), where("billNumber", "==", cleanBillNo));
          const dupSnap = await getDocs(dupQ);
          if (dupSnap.docs.some((d) => d.data().status !== "rejected")) {
            setUploading(false);
            return setMsg({ type: "err", text: `Invoice #${cleanBillNo} pehle hi upload ho chuka hai.` });
          }

          await addDoc(collection(db, "bill_submissions"), {
            phone: customer.phone,
            customerName: sanitizeText(customer.name, 40),
            billNumber: cleanBillNo,
            claimedAmount: amt,
            imageBase64: previewImage,
            status: "pending",
            starsAwarded: 0,
            createdAt: serverTimestamp()
          });

          await updateDoc(doc(db, "customers", customer.phone), {
            lastActivityAt: serverTimestamp()
          });

          localStorage.setItem("kfm_last_bill_upload_ms", String(Date.now()));
          setBillNumber("");
          setClaimedAmount("");
          setPreviewImage(null);
          setMsg({
            type: "ok",
            text: "✅ Bill upload ho gaya! Verification ke baad Star add ho jayega."
          });

          setActivePopup({
            type: "upload_success",
            billNumber: cleanBillNo
          });
        } catch (err) {
          setMsg({ type: "err", text: "Upload nahi ho paya. Internet ya Firebase Rules check karein." });
        }
        setUploading(false);
      };

      const handleItemRequestSubmit = async (e) => {
        e.preventDefault();
        if (!verifyCsrfToken(SESSION_CSRF_TOKEN)) return;

        const lastReqMs = Number(localStorage.getItem("kfm_last_demand_ms") || 0);
        const elapsed = Date.now() - lastReqMs;
        if (elapsed < DEMAND_COOLDOWN_MS) {
          const waitSec = Math.ceil((DEMAND_COOLDOWN_MS - elapsed) / 1000);
          return alert(`Kripya ${waitSec} second ruk kar agla item bhejein.`);
        }

        const cleanItem = sanitizeText(itemRequest, 80);
        if (cleanItem.length < 2) return;

        setRequestSending(true);
        try {
          await ensureCustomerAuth();
          await addDoc(collection(db, "item_requests"), {
            phone: customer.phone,
            customerName: sanitizeText(customer.name, 40),
            itemName: cleanItem,
            createdAt: serverTimestamp()
          });
          localStorage.setItem("kfm_last_demand_ms", String(Date.now()));
          setItemRequest("");
          setRequestSentMsg(`✅ "${cleanItem}" note kar liya hai! Samaan aate hi WhatsApp par batayenge.`);
          setTimeout(() => setRequestSentMsg(""), 5000);
        } catch (err) {
          alert("Request send nahi ho payi, dubara try karein.");
        }
        setRequestSending(false);
      };

      const RiceExclusionNotice = () => (
        <div className="bg-amber-50/95 border-2 border-amber-300 rounded-2xl p-3 flex items-start gap-2.5 shadow-sm">
          <span className="text-lg leading-none mt-0.5 shrink-0">📢</span>
          <div className="text-xs text-amber-950 leading-relaxed">
            <p className="font-extrabold text-amber-900">Zaroori Soochna (30 November Ke Baad):</p>
            <p className="mt-0.5 font-medium">
              30 November ke baad Stars sirf <strong>Rice (Chawal) ko chhodkar</strong> baaki bill amount par hi milenge{" "}
              <span className="text-amber-800 font-semibold">(Bill amount exclusive of Rice)</span>.
            </p>
          </div>
        </div>
      );

      // ==========================================
      // MOBILE-FIRST WELCOME & LOGIN VIEW
      // ==========================================
      if (!customer) {
        return (
          <div className="space-y-3.5 mt-1">
            <div className="bg-gradient-to-br from-emerald-800 via-teal-700 to-amber-500 text-white rounded-3xl p-5 shadow-xl relative overflow-hidden">
              <div className="absolute -right-4 -top-4 text-6xl opacity-20 select-none animate-float">🎁</div>
              <div className="flex items-center gap-3 mb-2.5">
                <StoreLogo className="w-12 h-12 rounded-2xl" />
                <div>
                  <span className="inline-block bg-white/20 backdrop-blur-sm text-amber-200 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                    🎉 Free Gifts & Special Offers
                  </span>
                  <h2 className="text-lg font-extrabold leading-snug mt-0.5">
                    Har ₹{MIN_BILL_AMOUNT}+ Shopping Par Payein <span className="text-amber-300">Golden Star! ⭐</span>
                  </h2>
                </div>
              </div>
              <p className="text-xs text-emerald-50">
                Bas <strong>{STARS_FOR_REWARD} Stars</strong> poore karein aur jeetein exciting Gifts & Offers!
              </p>

              <div className="grid grid-cols-3 gap-2 mt-3.5">
                <div className="bg-white/15 backdrop-blur-sm rounded-2xl p-2 text-center border border-white/20">
                  <div className="text-lg">🛍️</div>
                  <p className="text-[10px] font-bold mt-0.5">1. Shop ₹{MIN_BILL_AMOUNT}+</p>
                </div>
                <div className="bg-white/15 backdrop-blur-sm rounded-2xl p-2 text-center border border-white/20">
                  <div className="text-lg">📸</div>
                  <p className="text-[10px] font-bold mt-0.5">2. Upload Bill</p>
                </div>
                <div className="bg-white/15 backdrop-blur-sm rounded-2xl p-2 text-center border border-white/20">
                  <div className="text-lg">🎁</div>
                  <p className="text-[10px] font-bold mt-0.5">3. Win Gifts!</p>
                </div>
              </div>
            </div>

            <RiceExclusionNotice />

            <div className="bg-white/95 backdrop-blur-md rounded-3xl shadow-lg border border-white p-5">
              <h3 className="text-base font-extrabold text-slate-800 text-center">
                Apna Star Card Kholne Ke Liye Number Dalein
              </h3>

              <form onSubmit={handleLogin} className="space-y-3.5 mt-3.5">
                <div>
                  <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">
                    📱 Mobile Number
                  </label>
                  <input
                    type="tel"
                    inputMode="numeric"
                    maxLength={10}
                    pattern="[6-9][0-9]{9}"
                    placeholder="10-digit mobile number"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value.replace(/\D/g, "").slice(0, 10))}
                    className="w-full px-4 py-3 bg-white border-2 border-emerald-200 rounded-2xl text-base font-semibold tracking-wider outline-none focus:border-emerald-500"
                    required
                  />
                </div>

                {isNewUser && (
                  <div className="animate-pop bg-amber-50 p-3 rounded-2xl border border-amber-200">
                    <label className="block text-[11px] font-bold text-amber-900 uppercase mb-1">
                      ✨ Swagat Hai! Apna Shubh Naam Likhein
                    </label>
                    <input
                      type="text"
                      maxLength={40}
                      placeholder="Apna naam likhein"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-white border border-amber-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500"
                      required
                    />
                  </div>
                )}

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-extrabold text-sm py-3.5 rounded-2xl shadow-lg shadow-emerald-600/25 transition active:scale-[0.99]"
                >
                  {loading ? "Checking..." : isNewUser ? "🎉 Mera Star Card Banayein" : "Apna Card Dekhein →"}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ==========================================
      // LOGGED-IN MOBILE-FIRST DASHBOARD
      // ==========================================
      const rewardReady = customer.stars >= STARS_FOR_REWARD;
      const progressPct = Math.min(100, Math.round(((customer.stars || 0) / STARS_FOR_REWARD) * 100));
      const pendingCount = myBills.filter((b) => b.status === "pending").length;
      const numericAmt = claimedAmount ? Number(claimedAmount) : 0;

      return (
        <div className="space-y-4">
          {/* POPUP MODAL FOR IMPORTANT UPDATES */}
          {activePopup && (
            <div
              onClick={() => setActivePopup(null)}
              className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-white rounded-3xl max-w-xs w-full p-5 text-center shadow-2xl border-2 border-amber-300 animate-pop relative overflow-hidden"
              >
                {activePopup.type === "upload_success" && (
                  <>
                    <div className="w-14 h-14 mx-auto rounded-2xl bg-emerald-100 text-3xl flex items-center justify-center mb-2.5 animate-float">
                      📸
                    </div>
                    <span className="inline-block bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase">
                      Invoice #{activePopup.billNumber} Submitted!
                    </span>
                    <h3 className="text-lg font-extrabold text-slate-800 mt-2">
                      Bill Upload Ho Gaya! 🎉
                    </h3>
                    <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                      Verify hote hi aapka Star card mein jud jayega aur WhatsApp par update milega.
                    </p>

                    <div className="mt-3.5 bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-2xl p-3">
                      <p className="text-xs font-bold text-slate-800">
                        {STORE_NAME} ki service pasand aayi?
                      </p>
                      <p className="text-[11px] text-slate-600 mt-0.5">
                        Google par 5★ rating dekar humein support karein!
                      </p>
                      <a
                        href={GOOGLE_REVIEW_URL}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="mt-2 w-full inline-flex items-center justify-center gap-1 bg-gradient-to-r from-amber-400 to-orange-400 text-slate-900 font-extrabold text-xs py-2.5 px-3 rounded-xl shadow"
                      >
                        ⭐ Rate Us 5 Stars on Google
                      </a>
                    </div>
                  </>
                )}

                {activePopup.type === "star_approved" && (
                  <>
                    <div className="w-14 h-14 mx-auto rounded-2xl bg-amber-100 text-3xl flex items-center justify-center mb-2.5 animate-float">
                      ⭐
                    </div>
                    <span className="inline-block bg-amber-100 text-amber-900 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase">
                      Verified & Approved!
                    </span>
                    <h3 className="text-lg font-extrabold text-slate-800 mt-2">
                      Badhai Ho! +{activePopup.starsAwarded} {activePopup.starsAwarded > 1 ? "Stars" : "Star"} Mile! 🥳
                    </h3>
                    <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                      Aapka Invoice #{activePopup.billNumber} verify ho gaya hai. Ab kul <strong>{customer.stars}/{STARS_FOR_REWARD} Stars</strong> ho gaye hain!
                    </p>
                  </>
                )}

                {activePopup.type === "reward_complete" && (
                  <>
                    <div className="w-14 h-14 mx-auto rounded-2xl bg-amber-100 text-3xl flex items-center justify-center mb-2.5 animate-float">
                      🎁
                    </div>
                    <span className="inline-block bg-amber-400 text-slate-900 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase">
                      🏆 5/5 Stars Completed!
                    </span>
                    <h3 className="text-lg font-extrabold text-slate-800 mt-2">
                      Aapka Reward Unlock Ho Gaya! 🎉
                    </h3>
                    <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                      Shandar {activePopup.name} ji! Offers and Gifts will be updated to you on WhatsApp soon!
                    </p>
                  </>
                )}

                <button
                  onClick={() => setActivePopup(null)}
                  className="mt-3.5 w-full bg-slate-900 text-white font-bold text-xs py-2.5 rounded-xl"
                >
                  Awesome! Continue →
                </button>
              </div>
            </div>
          )}

          {/* HOME SCREEN INSTALL GUIDE MODAL */}
          {showHomeScreenModal && (
            <div
              onClick={() => setShowHomeScreenModal(false)}
              className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-white rounded-3xl max-w-xs w-full p-5 shadow-2xl border-2 border-emerald-300 animate-pop"
              >
                <div className="text-center mb-3">
                  <StoreLogo className="w-14 h-14 mx-auto mb-2 rounded-2xl" />
                  <h3 className="text-base font-extrabold text-slate-800">
                    KFM Star Card Home Screen Par Save Karein
                  </h3>
                  <p className="text-[11px] text-slate-500 mt-0.5">
                    Agli baar bina link dhoondhe 1 tap mein card kholein!
                  </p>
                </div>

                <div className="space-y-2.5 text-xs text-slate-700 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                  <div>
                    <p className="font-extrabold text-emerald-800">🤖 Android (Chrome):</p>
                    <p className="text-[11px] mt-0.5">
                      Upar right corner mein <strong>⋮ (3 dots)</strong> par tap karein → <strong>"Add to Home screen"</strong> ya <strong>"Install app"</strong> chunein.
                    </p>
                  </div>
                  <div className="pt-2 border-t border-slate-200">
                    <p className="font-extrabold text-emerald-800">🍎 iPhone (Safari):</p>
                    <p className="text-[11px] mt-0.5">
                      Neeche <strong>⬆️ (Share)</strong> button dabakar <strong>"Add to Home Screen"</strong> par tap karein.
                    </p>
                  </div>
                </div>

                <button
                  onClick={() => setShowHomeScreenModal(false)}
                  className="mt-4 w-full bg-emerald-600 text-white font-bold text-xs py-3 rounded-xl"
                >
                  Samajh Gaya 👍
                </button>
              </div>
            </div>
          )}

          {/* SAVE CARD ON HOME SCREEN BANNER */}
          {!hideInstallBanner && (
            <div className="bg-white/95 backdrop-blur-md border border-amber-300 rounded-2xl px-3.5 py-2.5 shadow-sm flex items-center justify-between gap-2">
              <button
                type="button"
                onClick={handleSaveHomeScreen}
                className="flex items-center gap-2.5 text-left flex-1"
              >
                <StoreLogo className="w-8 h-8 rounded-lg" />
                <div>
                  <p className="text-xs font-extrabold text-slate-800 leading-tight">
                    Save KFM Star Card on Home Screen
                  </p>
                  <p className="text-[10px] text-slate-500">App icon ke saath 1-tap mein card kholein →</p>
                </div>
              </button>
              <button
                type="button"
                onClick={() => {
                  setHideInstallBanner(true);
                  localStorage.setItem("kfm_hide_install", "1");
                }}
                className="text-slate-400 hover:text-slate-600 text-xs px-1.5 py-1"
                title="Dismiss"
              >
                ✕
              </button>
            </div>
          )}

          {/* VIBRANT STAR CARD */}

            <form onSubmit={handleItemRequestSubmit} className="flex gap-2">
