                        <p className="text-xs text-slate-500 mt-1">
                          {c.phone} • Bills: {c.totalApprovedBills || 0} • Rewards: {c.rewardsEarned || 0}
                        </p>
                      </div>

                      <div className="flex items-center gap-1 shrink-0">
                        {c.stars >= STARS_FOR_REWARD && (
                          <button
                            onClick={() => handleRedeem(c)}
                            className="bg-amber-500 text-white text-[11px] font-bold px-2 py-2 rounded-xl"
                          >
                            Redeem
                          </button>
                        )}
                        <button
                          onClick={() => handleOpenCustomerRecords(c.phone)}
                          className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 text-xs font-bold"
                          title="Date-by-Date Bills Dekhein"
                        >
                          🗂️
                        </button>
                        <button
                          onClick={() => handleDirectAddStar(c)}
                          className="px-2 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 text-xs font-extrabold"
                          title="Direct +1 Star Add Karein"
                        >
                          +1★
                        </button>
                        <button
                          onClick={() => handleSendReminder(c, waMsg)}
                          className={`px-2 py-2 rounded-xl text-xs font-bold border ${
                            remStatus.due
                              ? "bg-emerald-600 text-white border-emerald-700 shadow-sm"
                              : "bg-emerald-50 text-emerald-700 border-emerald-200"
                          }`}
                          title="Send WhatsApp & Reset 7-Day Timer"
                        >
                          💬
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}

          {/* TAB 3: DEDICATED DATE-BY-DATE STORED BILL RECORDS */}
          {tab === "records" && (
            <div className="space-y-3">
              {/* Customer Selector Card */}
              <div className="bg-white rounded-2xl p-4 border shadow-sm space-y-3">
                <div>
                  <h3 className="font-extrabold text-sm text-slate-800">
                    🗂️ Customer-Wise Date-by-Date Bill Records
                  </h3>
                  <p className="text-[11px] text-slate-500">
                    Customer select karein—unke sabhi stored bills aur photos date ke hisaab se dikhenge
                  </p>
                </div>

                {/* Search & Select Dropdown */}
                <div className="space-y-2">
                  <input
                    type="text"
                    placeholder="🔍 Customer ka naam ya mobile number likhkar filter karein..."
                    value={recordSearch}
                    onChange={(e) => setRecordSearch(e.target.value)}
                    className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium outline-none focus:bg-white focus:border-emerald-500"
                  />

                  <select
                    value={selectedRecordPhone}
                    onChange={(e) => setSelectedRecordPhone(e.target.value)}
                    className="w-full px-3.5 py-2.5 bg-white border-2 border-emerald-300 rounded-xl text-xs font-bold text-slate-800 outline-none focus:border-emerald-600"
                  >
                    <option value="">-- Yahan Tap Karke Customer Select Karein ({recordSelectableCustomers.length}) --</option>
                    {recordSelectableCustomers.map((c) => (
                      <option key={c.phone} value={c.phone}>
                        {c.name} (+91 {c.phone}) — {c.stars}/{STARS_FOR_REWARD} ★
                      </option>
                    ))}
                  </select>
                </div>

                {/* Quick Pick Pills when no customer is selected yet */}
                {!selectedRecordPhone && recordSelectableCustomers.length > 0 && (
                  <div className="pt-1">
                    <p className="text-[10px] font-bold text-slate-400 uppercase mb-1.5">Ya neeche se tap karein:</p>
                    <div className="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto">
                      {recordSelectableCustomers.slice(0, 15).map((c) => (
                        <button
                          key={c.phone}
                          type="button"
                          onClick={() => setSelectedRecordPhone(c.phone)}
                          className="px-2.5 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-900 border border-emerald-200 text-xs font-semibold"
                        >
                          {c.name} ({c.phone.slice(-4)})
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              {/* Selected Customer Date-by-Date Bill List */}
              {selectedRecordCustomer && (
                <div className="space-y-3">
                  {/* Customer Summary Header */}
                  <div className="bg-gradient-to-r from-emerald-800 to-teal-700 text-white rounded-2xl p-4 flex items-center justify-between">
                    <div>
                      <p className="text-[10px] uppercase tracking-wider text-amber-300 font-bold">Selected Customer</p>
                      <h4 className="font-extrabold text-base">{selectedRecordCustomer.name}</h4>
                      <p className="text-xs text-emerald-100">
                        +91 {selectedRecordCustomer.phone} • Stars: {selectedRecordCustomer.stars}/{STARS_FOR_REWARD} ★
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setSelectedRecordPhone("")}
                      className="px-3 py-1.5 rounded-xl bg-white/15 hover:bg-white/25 text-xs font-bold"
                    >
                      Change
                    </button>
                  </div>

                  {loadingRecords ? (
                    <div className="bg-white rounded-2xl p-6 text-center border text-xs text-slate-500">
                      Bills load ho rahe hain...
                    </div>
                  ) : customerRecordBills.length === 0 ? (
                    <div className="bg-white rounded-2xl p-6 text-center border text-xs text-slate-500">
                      Is customer ka abhi tak koi bill upload record nahi hai.
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <p className="text-xs font-extrabold text-slate-700 px-1">
                        📅 Date-by-Date Bills ({customerRecordBills.length} Total)
                      </p>
                      {customerRecordBills.map((b) => {
                        const awarded = b.starsAwarded || 1;
                        return (
                          <div key={b.id} className="bg-white rounded-2xl border shadow-sm overflow-hidden">
                            <div className="p-3.5 flex items-start justify-between gap-2 border-b bg-slate-50/70">
                              <div>
                                <div className="flex items-center gap-2 flex-wrap">
                                  <span className="bg-slate-900 text-white text-xs font-extrabold px-2.5 py-0.5 rounded-lg">
                                    Invoice #{b.billNumber}
                                  </span>
                                  {b.claimedAmount > 0 && (
                                    <span className="text-xs font-extrabold text-emerald-700">
                                      ₹{b.claimedAmount}
                                    </span>
                                  )}
                                </div>
                                <p className="text-xs font-semibold text-slate-600 mt-1">
                                  📅 {formatDateTime(b.createdAt)}
                                </p>
                                {b.status === "rejected" && b.rejectReason && (
                                  <p className="text-[11px] text-red-600 mt-0.5">Reason: {b.rejectReason}</p>
                                )}
                              </div>

                              <span
                                className={`text-[11px] font-extrabold px-2.5 py-1 rounded-full shrink-0 ${
                                  b.status === "pending"
                                    ? "bg-amber-200 text-amber-900"
                                    : b.status === "approved"
                                    ? "bg-emerald-600 text-white"
                                    : "bg-red-100 text-red-800"
                                }`}
                              >
                                {b.status === "pending"
                                  ? "⏳ Pending"
                                  : b.status === "approved"
                                  ? `⭐ +${awarded} ${awarded > 1 ? "Stars" : "Star"}`
                                  : "❌ Rejected"}
                              </span>
                            </div>

                            {/* Stored Bill Photo with Zoom */}
                            {b.imageBase64 ? (
                              <div className="bg-slate-900 p-2.5 flex flex-col items-center">
                                <img
                                  src={b.imageBase64}
                                  onClick={() =>
                                    setZoomData({
                                      src: b.imageBase64,
                                      title: `${selectedRecordCustomer.name} • Invoice #${b.billNumber} (${formatDateTime(b.createdAt)})`
                                    })
                                  }
                                  alt={`Invoice ${b.billNumber}`}
                                  className="max-h-60 object-contain rounded cursor-zoom-in"
                                />
                                <button
                                  type="button"
                                  onClick={() =>
                                    setZoomData({
                                      src: b.imageBase64,
                                      title: `${selectedRecordCustomer.name} • Invoice #${b.billNumber} (${formatDateTime(b.createdAt)})`
                                    })
                                  }
                                  className="mt-2 px-3.5 py-1.5 rounded-full bg-amber-400 text-slate-900 text-xs font-extrabold shadow"
                                >
                                  🔍 Full Screen Zoom Karein
                                </button>
                              </div>
                            ) : (
                              <div className="p-3 text-center text-[11px] text-slate-400 bg-slate-50">
                                (Purana bill — photo archived)
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* TAB 4: CUSTOMER ITEM DEMANDS */}
          {tab === "demands" && (
            <div className="space-y-2.5">
              {itemRequests.length === 0 ? (
                <div className="bg-white rounded-2xl p-8 text-center border text-xs text-slate-500">
                  Abhi kisi customer ki koi item demand pending nahi hai.
                </div>
              ) : (
                itemRequests.map((req) => (
                  <div key={req.id} className="bg-white rounded-2xl p-4 border flex items-center justify-between gap-2">
                    <div>
                      <p className="font-extrabold text-sm text-slate-800">📦 {req.itemName}</p>
                      <p className="text-xs text-slate-500 mt-0.5">
                        {req.customerName} • +91 {req.phone}
                      </p>
                    </div>
                    <div className="flex items-center gap-1.5 shrink-0">
                      <button
                        onClick={() => handleNotifyAndCloseDemand(req)}
                        className="px-3 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold"
                        title="WhatsApp par batayein ki samaan aa gaya hai"
                      >
                        💬 Notify
                      </button>
                      <button
                        onClick={() => handleDeleteDemand(req.id)}
                        className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold"
                        title="Done / Fulfilled"
                      >
                        ✅
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          )}

          {zoomData && (
            <BillZoomModal
              src={zoomData.src}
              title={zoomData.title}
              onClose={() => setZoomData(null)}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
