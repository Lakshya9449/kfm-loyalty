  <!-- React & Babel -->

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(4deg); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(7px) rotate(-4deg); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes shimmerGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.45); }
      50% { box-shadow: 0 0 22px rgba(251, 191, 36, 0.85); }
    }
    .animate-float { animation: floatSlow 3.6s ease-in-out infinite; }
    .animate-float-rev { animation: floatReverse 4.2s ease-in-out infinite; }
    .animate-pop { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .star-glow { animation: shimmerGlow 2.2s ease-in-out infinite; }

    /* Mobile-First Festive Grocery & Star Background */
    .festive-bg {
      background-color: #fffbeb;
      background-image:
        radial-gradient(circle at 12% 10%, rgba(251, 191, 36, 0.32) 0px, transparent 42%),
        radial-gradient(circle at 88% 14%, rgba(16, 185, 129, 0.26) 0px, transparent 44%),
        radial-gradient(circle at 85% 85%, rgba(249, 115, 22, 0.22) 0px, transparent 46%),
        radial-gradient(circle at 15% 88%, rgba(20, 184, 166, 0.26) 0px, transparent 44%),
        url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23059669' fill-opacity='0.065'%3E%3Cpath d='M40 14l4.5 9.2 10.1 1.5-7.3 7.1 1.7 10.1L40 37.1l-9 4.8 1.7-10.1-7.3-7.1 10.1-1.5L40 14zm0 44a6 6 0 1 1 0 12 6 6 0 0 1 0-12zM14 54l3 6 6.6 1-4.8 4.6 1.1 6.6L14 69l-5.9 3.2 1.1-6.6-4.8-4.6 6.6-1 3-6zm52 0l3 6 6.6 1-4.8 4.6 1.1 6.6L66 69l-5.9 3.2 1.1-6.6-4.8-4.6 6.6-1 3-6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
  </style>
</head>
<body class="festive-bg text-slate-900 font-sans min-h-screen relative overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
      collection, addDoc, query, where,
      onSnapshot, serverTimestamp, increment, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 1. FIREBASE CONFIG (Connected)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDqy3SmMrTyO1glyairloHUnVso306Ow2o",
      authDomain: "kfm-loyalty.firebaseapp.com",
      projectId: "kfm-loyalty",
      storageBucket: "kfm-loyalty.firebasestorage.app",
      messagingSenderId: "388917961664",
      appId: "1:388917961664:web:2eca6ac24b0889a4845e25"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ==========================================
    // 2. STORE SETTINGS
    // ==========================================
    const STORE_NAME = "KHANDELWAL FOOD MART";
    const SITE_URL = "https://lakshya9449.github.io/kfm-loyalty/";
    const GOOGLE_REVIEW_URL = "https://maps.app.goo.gl/iGBTXhCznfrmEtUz9";
    const MIN_BILL_AMOUNT = 1000;
    const STARS_FOR_REWARD = 5;
    const ADMIN_PIN = "8052"; // Owner Password
    const INACTIVE_DAYS_LIMIT = 15;
    const REMINDER_DAYS_CYCLE = 7;

    // Image Compressor
    const compressBillImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 900;
            const scale = MAX_WIDTH / img.width;
            canvas.width = img.width > MAX_WIDTH ? MAX_WIDTH : img.width;
            canvas.height = img.width > MAX_WIDTH ? img.height * scale : img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.65));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    };

    // Helper: Timestamp to milliseconds
    const toMillisSafe = (ts) => {
      if (!ts) return null;
      if (ts.toMillis) return ts.toMillis();
      if (ts.seconds) return ts.seconds * 1000;
      return null;
    };

    // Helper: Format Date & Time cleanly
    const formatDateTime = (ts) => {
      const ms = toMillisSafe(ts);
      if (!ms) return "Date pending";
      const d = new Date(ms);
      const datePart = d.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
      const timePart = d.toLocaleTimeString("en-IN", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
      return `${datePart} • ${timePart}`;
    };

    // Helper: Days since timestamp
    const getDaysSince = (ts) => {
      const ms = toMillisSafe(ts);
      if (!ms) return null;
      return Math.floor((Date.now() - ms) / (1000 * 60 * 60 * 24));
    };

    // Helper: Check if 7-day reminder is due
    const getReminderStatus = (cust) => {
      const lastActMs = toMillisSafe(cust.lastActivityAt) || 0;
      const lastRemMs = toMillisSafe(cust.lastReminderAt) || 0;
      const latestTouchMs = Math.max(lastActMs, lastRemMs);

      if (!latestTouchMs) {
        return { due: true, daysSince: null, nextInDays: 0 };
      }

      const daysPassed = Math.floor((Date.now() - latestTouchMs) / (1000 * 60 * 60 * 24));
      return {
        due: daysPassed >= REMINDER_DAYS_CYCLE,
        daysSince: daysPassed,
        nextInDays: Math.max(0, REMINDER_DAYS_CYCLE - daysPassed)
      };
    };

    // ==========================================
    // INTERACTIVE FULL-SCREEN BILL PHOTO ZOOM MODAL
    // ==========================================
    function BillZoomModal({ src, title, onClose }) {
      const [zoomed, setZoomed] = useState(false);

      if (!src) return null;

      return (
        <div
          onClick={onClose}
          className="fixed inset-0 bg-black/95 z-50 flex flex-col"
        >
          {/* Top Zoom Control Bar */}
          <div
            onClick={(e) => e.stopPropagation()}
            className="flex items-center justify-between px-4 py-3 bg-slate-900/90 border-b border-slate-700 text-white shrink-0"
          >
            <div className="min-w-0 pr-2">
              <p className="text-xs font-extrabold truncate">{title || "Bill Receipt Photo"}</p>
              <p className="text-[10px] text-slate-400">
                {zoomed ? "Scroll karke bill check karein" : "Zoom button ya photo par tap karein"}
              </p>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <button
                type="button"
                onClick={() => setZoomed((z) => !z)}
                className="px-3 py-1.5 rounded-xl bg-amber-400 text-slate-900 font-extrabold text-xs shadow"
              >
                {zoomed ? "🔎 Fit Screen" : "🔍 Zoom In (2x)"}
              </button>
              <button
                type="button"
                onClick={onClose}
                className="px-3 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs"
              >
                ✕ Close
              </button>
            </div>
          </div>

          {/* Scrollable / Zoomable Image Container */}
          <div
            onClick={(e) => e.stopPropagation()}
            className={`flex-1 overflow-auto flex ${
              zoomed ? "items-start justify-start p-4" : "items-center justify-center p-3"
            }`}
          >
            <img
              src={src}
              onClick={() => setZoomed((z) => !z)}
              alt="Bill Receipt"
              style={
                zoomed
                  ? { width: "185%", maxWidth: "none", cursor: "zoom-out" }
                  : { maxHeight: "84vh", maxWidth: "100%", cursor: "zoom-in" }
              }
              className="rounded-lg shadow-2xl transition-all duration-200 select-none"
            />
          </div>
        </div>
      );
    }

    // ==========================================
    // MOBILE-OPTIMIZED DECORATIVE BACKGROUND
    // ==========================================
    function FestiveBackgroundDecor() {
      return (
        <div className="fixed inset-0 pointer-events-none overflow-hidden z-0 select-none" aria-hidden="true">
          <div className="absolute -top-14 -left-14 w-56 h-56 rounded-full bg-amber-300/30 blur-3xl" />
          <div className="absolute top-1/3 -right-16 w-60 h-60 rounded-full bg-emerald-300/25 blur-3xl" />
          <div className="absolute bottom-12 -left-14 w-56 h-56 rounded-full bg-orange-300/25 blur-3xl" />
          <div className="absolute -bottom-16 right-0 w-60 h-60 rounded-full bg-teal-300/25 blur-3xl" />

          <div className="absolute top-16 left-2 w-9 h-9 rounded-xl bg-white/80 backdrop-blur-sm shadow-sm border border-amber-200 flex items-center justify-center text-lg animate-float opacity-85">
            🧺
          </div>
          <div className="absolute top-20 right-2 w-9 h-9 rounded-full bg-white/80 backdrop-blur-sm shadow-sm border border-emerald-200 flex items-center justify-center text-base animate-float-rev opacity-85">
            ⭐
          </div>
          <div className="absolute top-[48%] left-1.5 w-8 h-8 rounded-xl bg-white/75 backdrop-blur-sm shadow-sm border border-orange-200 flex items-center justify-center text-base animate-float-rev opacity-75">
            🎁
          </div>
          <div className="absolute top-[52%] right-1.5 w-8 h-8 rounded-xl bg-white/75 backdrop-blur-sm shadow-sm border border-amber-200 flex items-center justify-center text-base animate-float opacity-75">
            🛍️
          </div>
          <div className="absolute bottom-6 left-2.5 w-9 h-9 rounded-full bg-white/80 backdrop-blur-sm shadow-sm border border-teal-200 flex items-center justify-center text-base animate-float opacity-80">
            🎊
          </div>
          <div className="absolute bottom-6 right-2.5 w-9 h-9 rounded-xl bg-white/80 backdrop-blur-sm shadow-sm border border-amber-200 flex items-center justify-center text-base animate-float-rev opacity-80">
            ✨
          </div>
        </div>
      );
    }

    // ==========================================
    // MAIN APP
    // ==========================================
    function App() {
      const isAdminUrl = new URLSearchParams(window.location.search).get("admin") === "true";
      const [mode, setMode] = useState(isAdminUrl ? "admin" : "customer");
      const tapCountRef = useRef(0);
      const tapTimerRef = useRef(null);

      // Triple Tap on Store Title to open Owner Login
      const handleTitleTap = () => {
        tapCountRef.current += 1;
        if (tapTimerRef.current) clearTimeout(tapTimerRef.current);

        if (tapCountRef.current >= 3) {
          tapCountRef.current = 0;
          setMode("admin");
          return;
        }

        tapTimerRef.current = setTimeout(() => {
          tapCountRef.current = 0;
        }, 700);
      };

      return (
        <div className="min-h-screen pb-14 relative">
          {mode === "customer" && <FestiveBackgroundDecor />}

          <header className="bg-gradient-to-r from-emerald-700 via-teal-700 to-emerald-800 text-white px-4 py-3 shadow-lg flex items-center justify-between sticky top-0 z-30 select-none border-b border-amber-300/30">
            <div onClick={handleTitleTap} className="cursor-pointer flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-xl bg-amber-400 text-slate-900 flex items-center justify-center text-xl shadow-md shrink-0">
                ⭐
              </div>
              <div>
                <h1 className="font-extrabold text-sm sm:text-base tracking-wide leading-tight">{STORE_NAME}</h1>
                <p className="text-[10px] text-amber-200 font-semibold tracking-wider uppercase">
                  ✨ Scan & Earn Star Club
                </p>
              </div>
            </div>
            {mode === "admin" && (
              <button
                onClick={() => setMode("customer")}
                className="text-xs bg-emerald-900/80 hover:bg-emerald-950 px-3 py-1.5 rounded-full border border-emerald-500 font-medium"
              >
                ← Customer View
              </button>
            )}
          </header>

          <main className={`${mode === "customer" ? "max-w-md" : "max-w-xl"} mx-auto px-3.5 py-3 relative z-10`}>
            {mode === "customer" ? <CustomerPortal /> : <AdminPortal />}
          </main>
        </div>
      );
    }

    // ==========================================
    // CUSTOMER PORTAL (MOBILE-FIRST + HINGLISH RICE NOTICE)
    // ==========================================
    function CustomerPortal() {
      const [phone, setPhone] = useState(() => localStorage.getItem("kfm_phone") || "");
      const [name, setName] = useState("");
      const [customer, setCustomer] = useState(null);
      const [isNewUser, setIsNewUser] = useState(false);
      const [loading, setLoading] = useState(false);

      const [billNumber, setBillNumber] = useState("");
      const [claimedAmount, setClaimedAmount] = useState("");
      const [previewImage, setPreviewImage] = useState(null);
      const [uploading, setUploading] = useState(false);
      const [msg, setMsg] = useState(null);
      const [myBills, setMyBills] = useState([]);
      const [zoomBillData, setZoomBillData] = useState(null);

      // Missing Item Request state
      const [itemRequest, setItemRequest] = useState("");
      const [requestSending, setRequestSending] = useState(false);
      const [requestSentMsg, setRequestSentMsg] = useState("");

      // Save Card on Home Screen state
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [showHomeScreenModal, setShowHomeScreenModal] = useState(false);
      const [hideInstallBanner, setHideInstallBanner] = useState(() => localStorage.getItem("kfm_hide_install") === "1");

      // Joyful Attention Popups
      const [activePopup, setActivePopup] = useState(null);
      const shownEventsRef = useRef(new Set());

      useEffect(() => {
        if (phone.length === 10) loadCustomer(phone);

        const handleBeforeInstall = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener("beforeinstallprompt", handleBeforeInstall);
        return () => window.removeEventListener("beforeinstallprompt", handleBeforeInstall);
      }, []);

      const handleSaveHomeScreen = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const choice = await deferredPrompt.userChoice;
          if (choice.outcome === "accepted") {
            setDeferredPrompt(null);
            setHideInstallBanner(true);
            localStorage.setItem("kfm_hide_install", "1");
          }
        } else {
          setShowHomeScreenModal(true);
        }
      };

      const loadCustomer = async (cleanPhone) => {
        setLoading(true);
        try {
          const custRef = doc(db, "customers", cleanPhone);
          const snap = await getDoc(custRef);

          if (!snap.exists()) {
            setIsNewUser(true);
            setLoading(false);
            return;
          }

          localStorage.setItem("kfm_phone", cleanPhone);
          setIsNewUser(false);

          onSnapshot(custRef, (d) => {
            if (d.exists()) {
              const data = d.data();
              setCustomer(data);

              const rewardKey = `reward_unlocked_${cleanPhone}_${data.stars}_${data.rewardsEarned || 0}`;
              if (
                data.stars >= STARS_FOR_REWARD &&
                !localStorage.getItem(rewardKey) &&
                !shownEventsRef.current.has(rewardKey)
              ) {
                shownEventsRef.current.add(rewardKey);
                localStorage.setItem(rewardKey, "1");
                setActivePopup({
                  type: "reward_complete",
                  name: data.name,
                  stars: data.stars
                });
              }
            } else {
              localStorage.removeItem("kfm_phone");
              setCustomer(null);
            }
          });

          const q = query(collection(db, "bill_submissions"), where("phone", "==", cleanPhone));
          onSnapshot(q, (qSnap) => {
            const list = [];
            qSnap.forEach((d) => list.push({ id: d.id, ...d.data() }));
            list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            setMyBills(list);

            const latestApproved = list.find((b) => b.status === "approved");
            if (latestApproved) {
              const seenKey = `kfm_seen_approved_${latestApproved.id}`;
              if (!localStorage.getItem(seenKey) && !shownEventsRef.current.has(seenKey)) {
                shownEventsRef.current.add(seenKey);
                localStorage.setItem(seenKey, "1");
                const awarded = latestApproved.starsAwarded || 1;
                setActivePopup((prev) =>
                  prev?.type === "reward_complete"
                    ? prev
                    : {
                        type: "star_approved",
                        billNumber: latestApproved.billNumber,
                        starsAwarded: awarded
                      }
                );
              }
            }
          });
        } catch (err) {
          alert("Firebase error: Firestore Rules check karein.");
        }
        setLoading(false);
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        const cleanPhone = phone.replace(/\D/g, "").slice(-10);
        if (cleanPhone.length !== 10) return alert("10-digit mobile number dalein.");

        if (isNewUser) {
          if (!name.trim()) return alert("Apna naam likhein.");
          setLoading(true);
          await setDoc(doc(db, "customers", cleanPhone), {
            phone: cleanPhone,
            name: name.trim(),
            stars: 0,
            totalApprovedBills: 0,
            rewardsEarned: 0,
            lastActivityAt: serverTimestamp()
          });
          await loadCustomer(cleanPhone);
        } else {
          await loadCustomer(cleanPhone);
        }
      };

      const handleFile = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const compressed = await compressBillImage(file);
        setPreviewImage(compressed);
        setMsg(null);
      };

      const handleBillSubmit = async (e) => {
        e.preventDefault();
        const cleanBillNo = billNumber.trim().toUpperCase();
        const amt = claimedAmount ? Number(claimedAmount) : 0;

        if (!cleanBillNo) {
          return setMsg({ type: "err", text: "Invoice / Bill Number likhna zaroori hai." });
        }
        if (claimedAmount && amt < MIN_BILL_AMOUNT) {
          return setMsg({ type: "err", text: `Star sirf ₹${MIN_BILL_AMOUNT}+ ke bill par milta hai.` });
        }
        if (!previewImage) {
          return setMsg({ type: "err", text: "Bill ki clear photo upload karein." });
        }

        setUploading(true);
        setMsg(null);

        try {
          const dupQ = query(collection(db, "bill_submissions"), where("billNumber", "==", cleanBillNo));
          const dupSnap = await getDocs(dupQ);
          if (dupSnap.docs.some((d) => d.data().status !== "rejected")) {
            setUploading(false);
            return setMsg({ type: "err", text: `Invoice #${cleanBillNo} pehle hi upload ho chuka hai.` });
          }

          await addDoc(collection(db, "bill_submissions"), {
            phone: customer.phone,
            customerName: customer.name,
            billNumber: cleanBillNo,
            claimedAmount: amt,
            imageBase64: previewImage,
            status: "pending",
            starsAwarded: 0,
            createdAt: serverTimestamp()
          });

          await updateDoc(doc(db, "customers", customer.phone), {
            lastActivityAt: serverTimestamp()
          });

          setBillNumber("");
          setClaimedAmount("");
          setPreviewImage(null);
          setMsg({
            type: "ok",
            text: "✅ Bill upload ho gaya! Verification ke baad Star add ho jayega."
          });

          setActivePopup({
            type: "upload_success",
            billNumber: cleanBillNo
          });
        } catch (err) {
          setMsg({ type: "err", text: "Upload fail hua. Internet ya Firestore Rules check karein." });
        }
        setUploading(false);
      };

      // Missing Item Request Submit
      const handleItemRequestSubmit = async (e) => {
        e.preventDefault();
        const cleanItem = itemRequest.trim();
        if (!cleanItem) return;

        setRequestSending(true);
        try {
          await addDoc(collection(db, "item_requests"), {
            phone: customer.phone,
            customerName: customer.name,
            itemName: cleanItem,
            createdAt: serverTimestamp()
          });
          setItemRequest("");
          setRequestSentMsg(`✅ "${cleanItem}" note kar liya hai! Samaan aate hi WhatsApp par batayenge.`);
          setTimeout(() => setRequestSentMsg(""), 5000);
        } catch (err) {
          alert("Request send nahi ho payi, dubara try karein.");
        }
        setRequestSending(false);
      };

      // Hinglish Rice Exclusion Notice Box
      const RiceExclusionNotice = () => (
        <div className="bg-amber-50/95 border-2 border-amber-300 rounded-2xl p-3 flex items-start gap-2.5 shadow-sm">
          <span className="text-lg leading-none mt-0.5 shrink-0">📢</span>
          <div className="text-xs text-amber-950 leading-relaxed">
            <p className="font-extrabold text-amber-900">Zaroori Soochna (30 November Ke Baad):</p>
            <p className="mt-0.5 font-medium">
              30 November ke baad Stars sirf <strong>Rice (Chawal) ko chhodkar</strong> baaki bill amount par hi milenge{" "}
              <span className="text-amber-800 font-semibold">(Bill amount exclusive of Rice)</span>.
            </p>
          </div>
        </div>
      );

      // ==========================================
      // MOBILE-FIRST WELCOME & LOGIN VIEW
      // ==========================================
      if (!customer) {
        return (
          <div className="space-y-3.5 mt-1">
            {/* Hero Welcome Card */}
            <div className="bg-gradient-to-br from-emerald-700 via-teal-600 to-amber-500 text-white rounded-3xl p-5 shadow-xl relative overflow-hidden">
              <div className="absolute -right-4 -top-4 text-6xl opacity-25 select-none animate-float">🎁</div>
              <span className="inline-block bg-white/20 backdrop-blur-sm text-amber-200 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider mb-1.5">
                🎉 Free Gifts & Special Offers
              </span>
              <h2 className="text-xl font-extrabold leading-snug">
                Har ₹{MIN_BILL_AMOUNT}+ Shopping Par Payein <span className="text-amber-300">Golden Star! ⭐</span>
              </h2>
              <p className="text-xs text-emerald-50 mt-1">
                Bas <strong>{STARS_FOR_REWARD} Stars</strong> poore karein aur jeetein exciting Gifts & Offers!
              </p>

              {/* Visual 3-Step Strip */}
              <div className="grid grid-cols-3 gap-2 mt-3.5">
                <div className="bg-white/15 backdrop-blur-sm rounded-2xl p-2 text-center border border-white/20">
                  <div className="text-lg">🛍️</div>
                  <p className="text-[10px] font-bold mt-0.5">1. Shop ₹{MIN_BILL_AMOUNT}+</p>
                </div>
                <div className="bg-white/15 backdrop-blur-sm rounded-2xl p-2 text-center border border-white/20">
                  <div className="text-lg">📸</div>
                  <p className="text-[10px] font-bold mt-0.5">2. Upload Bill</p>
                </div>
                <div className="bg-white/15 backdrop-blur-sm rounded-2xl p-2 text-center border border-white/20">
                  <div className="text-lg">🎁</div>
                  <p className="text-[10px] font-bold mt-0.5">3. Win Gifts!</p>
                </div>
              </div>
            </div>

            {/* Hinglish Rice Exclusion Notice */}
            <RiceExclusionNotice />

            {/* Login Form Card */}
            <div className="bg-white/95 backdrop-blur-md rounded-3xl shadow-lg border border-white p-5">
              <h3 className="text-base font-extrabold text-slate-800 text-center">
                Apna Star Card Kholne Ke Liye Number Dalein
              </h3>

              <form onSubmit={handleLogin} className="space-y-3.5 mt-3.5">
                <div>
                  <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">
                    📱 Mobile Number
                  </label>
                  <input
                    type="tel"
                    inputMode="numeric"
                    maxLength={10}
                    placeholder="10-digit mobile number"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value.replace(/\D/g, ""))}
                    className="w-full px-4 py-3 bg-white border-2 border-emerald-200 rounded-2xl text-base font-semibold tracking-wider outline-none focus:border-emerald-500"
                    required
                  />
                </div>

                {isNewUser && (
                  <div className="animate-pop bg-amber-50 p-3 rounded-2xl border border-amber-200">
                    <label className="block text-[11px] font-bold text-amber-900 uppercase mb-1">
                      ✨ Swagat Hai! Apna Shubh Naam Likhein
                    </label>
                    <input
                      type="text"
                      placeholder="Apna naam likhein"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-white border border-amber-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500"
                      required
                    />
                  </div>
                )}

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-extrabold text-sm py-3.5 rounded-2xl shadow-lg shadow-emerald-600/25 transition active:scale-[0.99]"
                >
                  {loading ? "Checking..." : isNewUser ? "🎉 Mera Star Card Banayein" : "Apna Card Dekhein →"}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ==========================================
      // LOGGED-IN MOBILE-FIRST DASHBOARD
      // ==========================================
      const rewardReady = customer.stars >= STARS_FOR_REWARD;
      const progressPct = Math.min(100, Math.round(((customer.stars || 0) / STARS_FOR_REWARD) * 100));
      const pendingCount = myBills.filter((b) => b.status === "pending").length;
      const numericAmt = claimedAmount ? Number(claimedAmount) : 0;

      return (
        <div className="space-y-4">
          {/* POPUP MODAL FOR IMPORTANT UPDATES */}
          {activePopup && (
            <div
              onClick={() => setActivePopup(null)}
              className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-white rounded-3xl max-w-xs w-full p-5 text-center shadow-2xl border-2 border-amber-300 animate-pop relative overflow-hidden"
              >
                {activePopup.type === "upload_success" && (
                  <>
                    <div className="w-14 h-14 mx-auto rounded-2xl bg-emerald-100 text-3xl flex items-center justify-center mb-2.5 animate-float">
                      📸
                    </div>
                    <span className="inline-block bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase">
                      Invoice #{activePopup.billNumber} Submitted!
                    </span>
                    <h3 className="text-lg font-extrabold text-slate-800 mt-2">
                      Bill Upload Ho Gaya! 🎉
                    </h3>
                    <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                      Verify hote hi aapka Star card mein jud jayega aur WhatsApp par update milega.
                    </p>

                    <div className="mt-3.5 bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-2xl p-3">
                      <p className="text-xs font-bold text-slate-800">
                        {STORE_NAME} ki service pasand aayi?
                      </p>
                      <p className="text-[11px] text-slate-600 mt-0.5">
                        Google par 5★ rating dekar humein support karein!
                      </p>
                      <a
                        href={GOOGLE_REVIEW_URL}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="mt-2 w-full inline-flex items-center justify-center gap-1.5 bg-gradient-to-r from-amber-400 to-orange-400 text-slate-900 font-extrabold text-xs py-2.5 px-3 rounded-xl shadow"
                      >
                        ⭐ Rate Us 5 Stars on Google
                      </a>
                    </div>
                  </>
                )}

                {activePopup.type === "star_approved" && (
                  <>
                    <div className="w-14 h-14 mx-auto rounded-2xl bg-amber-100 text-3xl flex items-center justify-center mb-2.5 animate-float">
                      ⭐
                    </div>
                    <span className="inline-block bg-amber-100 text-amber-900 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase">
                      Verified & Approved!
                    </span>
                    <h3 className="text-lg font-extrabold text-slate-800 mt-2">
                      Badhai Ho! +{activePopup.starsAwarded} {activePopup.starsAwarded > 1 ? "Stars" : "Star"} Mile! 🥳
                    </h3>
                    <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                      Aapka Invoice #{activePopup.billNumber} verify ho gaya hai. Ab kul <strong>{customer.stars}/{STARS_FOR_REWARD} Stars</strong> ho gaye hain!
                    </p>
                  </>
                )}

                {activePopup.type === "reward_complete" && (
                  <>
                    <div className="w-14 h-14 mx-auto rounded-2xl bg-amber-100 text-3xl flex items-center justify-center mb-2.5 animate-float">
                      🎁
                    </div>
                    <span className="inline-block bg-amber-400 text-slate-900 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase">
                      🏆 5/5 Stars Completed!
                    </span>
                    <h3 className="text-lg font-extrabold text-slate-800 mt-2">
                      Aapka Reward Unlock Ho Gaya! 🎉
                    </h3>
                    <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                      Shandar {activePopup.name} ji! Offers and Gifts will be updated to you on WhatsApp soon!
                    </p>
                  </>
                )}

                <button
                  onClick={() => setActivePopup(null)}
                  className="mt-3.5 w-full bg-slate-900 text-white font-bold text-xs py-2.5 rounded-xl"
                >
                  Awesome! Continue →
                </button>
              </div>
            </div>
          )}

          {/* HOME SCREEN INSTALL GUIDE MODAL */}
          {showHomeScreenModal && (
            <div
              onClick={() => setShowHomeScreenModal(false)}
              className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-white rounded-3xl max-w-xs w-full p-5 shadow-2xl border-2 border-emerald-300 animate-pop"
              >
                <div className="text-center mb-3">
                  <div className="w-12 h-12 mx-auto rounded-2xl bg-emerald-100 text-2xl flex items-center justify-center mb-2">
                    📲
                  </div>
                  <h3 className="text-base font-extrabold text-slate-800">
                    Star Card Home Screen Par Save Karein
                  </h3>
                  <p className="text-[11px] text-slate-500 mt-0.5">
                    Agli baar bina link dhoondhe 1 tap mein card kholein!
                  </p>
                </div>

                <div className="space-y-2.5 text-xs text-slate-700 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                  <div>
                    <p className="font-extrabold text-emerald-800">🤖 Android (Chrome):</p>
                    <p className="text-[11px] mt-0.5">
                      Upar right corner mein <strong>⋮ (3 dots)</strong> par tap karein → <strong>"Add to Home screen"</strong> ya <strong>"Install app"</strong> chunein.
                    </p>
                  </div>
                  <div className="pt-2 border-t border-slate-200">
                    <p className="font-extrabold text-emerald-800">🍎 iPhone (Safari):</p>
                    <p className="text-[11px] mt-0.5">
                      Neeche <strong>⬆️ (Share)</strong> button dabakar <strong>"Add to Home Screen"</strong> par tap karein.
                    </p>
                  </div>
                </div>

                <button
                  onClick={() => setShowHomeScreenModal(false)}
                  className="mt-4 w-full bg-emerald-600 text-white font-bold text-xs py-3 rounded-xl"
                >
                  Samajh Gaya 👍
                </button>
              </div>
            </div>
          )}

          {/* SAVE CARD ON HOME SCREEN BANNER */}
          {!hideInstallBanner && (
            <div className="bg-white/95 backdrop-blur-md border border-amber-300 rounded-2xl px-3.5 py-2.5 shadow-sm flex items-center justify-between gap-2">
              <button
                type="button"
                onClick={handleSaveHomeScreen}
                className="flex items-center gap-2 text-left flex-1"
              >
                <span className="text-lg shrink-0">📲</span>
                <div>
                  <p className="text-xs font-extrabold text-slate-800 leading-tight">
                    Save Star Card on Home Screen
                  </p>
                  <p className="text-[10px] text-slate-500">App ki tarah 1-tap mein card kholein →</p>
                </div>
              </button>
              <button
                type="button"
                onClick={() => {
                  setHideInstallBanner(true);
                  localStorage.setItem("kfm_hide_install", "1");
                }}
                className="text-slate-400 hover:text-slate-600 text-xs px-1.5 py-1"
                title="Dismiss"
              >
                ✕
              </button>
            </div>
          )}

          {/* VIBRANT STAR CARD */}
          <div className="bg-gradient-to-br from-emerald-800 via-teal-700 to-emerald-900 text-white rounded-3xl p-5 shadow-xl relative overflow-hidden border border-emerald-500/30">
            <div className="absolute -right-5 -top-5 text-7xl opacity-10 select-none">⭐</div>

            <div className="flex justify-between items-start relative z-10">
              <div>
                <span className="inline-flex items-center gap-1 bg-amber-400/20 text-amber-300 text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full border border-amber-300/30">
                  ✨ VIP Loyalty Member
                </span>
                <h2 className="text-lg font-extrabold mt-1">{customer.name}</h2>
                <p className="text-xs text-emerald-100">+91 {customer.phone}</p>
              </div>
              <button
                onClick={() => {
                  localStorage.removeItem("kfm_phone");
                  setCustomer(null);
                  setPhone("");
                }}
                className="text-xs bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-xl font-semibold backdrop-blur-sm"
              >
                Change
              </button>
            </div>

            {/* Interactive Star Slots + Progress Bar */}
            <div className="my-3.5 bg-black/25 backdrop-blur-sm rounded-2xl p-3.5 border border-white/10">
              <div className="flex justify-between items-center text-xs mb-2">
                <span className="text-emerald-100 font-semibold">Aapke Golden Stars</span>
                <span className="font-extrabold text-amber-300 bg-amber-400/15 px-2.5 py-0.5 rounded-full text-[11px]">
                  {customer.stars} / {STARS_FOR_REWARD} Stars ({progressPct}%)
                </span>
              </div>

              <div className="w-full h-2 bg-white/15 rounded-full overflow-hidden mb-3">
                <div
                  className="h-full bg-gradient-to-r from-amber-300 via-yellow-400 to-orange-400 rounded-full transition-all duration-700"
                  style={{ width: `${progressPct}%` }}
                />
              </div>

              <div className="grid grid-cols-5 gap-1.5">
                {Array.from({ length: STARS_FOR_REWARD }).map((_, i) => {
                  const filled = i < customer.stars;
                  const isFinalGift = i === STARS_FOR_REWARD - 1;
                  return (
                    <div
                      key={i}
                      className={`aspect-square rounded-2xl flex flex-col items-center justify-center border-2 transition-all ${
                        filled
                          ? "bg-gradient-to-br from-amber-300 to-amber-500 border-yellow-200 star-glow scale-[1.03]"
                          : "bg-white/10 border-dashed border-white/25"
                      }`}
                    >
                      <span className={`text-xl ${filled ? "" : "opacity-55"}`}>
                        {filled ? "⭐" : isFinalGift ? "🎁" : "☆"}
                      </span>
                      <span className={`text-[9px] font-extrabold mt-0.5 ${filled ? "text-slate-900" : "text-emerald-200/70"}`}>
                        {isFinalGift ? "GIFT" : `#${i + 1}`}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Status Banner */}
            <div className="bg-gradient-to-r from-amber-400/20 to-emerald-400/20 border border-amber-300/30 rounded-2xl p-2.5 text-xs flex items-center gap-2">
              <span className="text-lg shrink-0">{rewardReady ? "🎉" : "🎁"}</span>
              {rewardReady ? (
                <p className="font-bold text-amber-200 leading-snug">
                  Badhai ho! Aapka Card complete ho gaya hai! Offers and Gifts will be updated to you on WhatsApp.
                </p>
              ) : (
                <p className="text-white font-medium leading-snug">
                  Offers and Gifts will be updated to you on WhatsApp once you complete the Card
                </p>
              )}
            </div>
          </div>

          {/* Hinglish Rice Exclusion Notice */}
          <RiceExclusionNotice />

          {/* Pending Bill Live Alert Pill */}
          {pendingCount > 0 && (
            <div className="bg-amber-100/95 backdrop-blur-sm border border-amber-300 text-amber-900 rounded-2xl px-3.5 py-2.5 flex items-center justify-between text-xs shadow-sm">
              <div className="flex items-center gap-2">
                <span className="text-base">⏳</span>
                <p className="font-bold">
                  Aapke {pendingCount} {pendingCount > 1 ? "bills" : "bill"} verification mein hain!
                </p>
              </div>
              <span className="bg-amber-500 text-white font-extrabold px-2 py-0.5 rounded-full text-[10px] uppercase">
                In Review
              </span>
            </div>
          )}

          {/* BILL UPLOAD CARD + SMART BILL BOOSTER NUDGE */}
          <div className="bg-white/95 backdrop-blur-md rounded-3xl shadow-lg border border-white p-5">
            <div className="flex items-center gap-2.5">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-400 text-slate-900 flex items-center justify-center text-xl shadow-sm shrink-0">
                📸
              </div>
              <div>
                <h3 className="font-extrabold text-slate-800 text-sm">
                  Naya Bill Upload Karein (₹{MIN_BILL_AMOUNT}+)
                </h3>
                <p className="text-[11px] text-slate-500">
                  Bill ki photo upload karein. Verify hote hi Star jud jayega.
                </p>
              </div>
            </div>

            {msg && (
              <div
                className={`mt-3 p-3 rounded-2xl text-xs ${
                  msg.type === "ok"
                    ? "bg-emerald-50 text-emerald-800 border border-emerald-200"
                    : "bg-red-50 text-red-700 border border-red-200"
                }`}
              >
                <p className="font-bold">{msg.text}</p>

                {msg.type === "ok" && (
                  <div className="mt-2.5 pt-2.5 border-t border-emerald-200/80 flex flex-col gap-2">
                    <p className="text-[11px] text-slate-700">
                      Service pasand aayi? Google par <strong>5★</strong> dekar support karein!
                    </p>
                    <a
                      href={GOOGLE_REVIEW_URL}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="w-full inline-flex items-center justify-center gap-1 bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold text-xs py-2 px-3 rounded-xl shadow-sm"
                    >
                      ⭐ Rate Us on Google
                    </a>
                  </div>
                )}
              </div>
            )}

            <form onSubmit={handleBillSubmit} className="space-y-3 mt-3.5">
              <div className="grid grid-cols-2 gap-2.5">
                <div>
                  <label className="block text-[11px] font-bold text-slate-700 mb-1">
                    Invoice Number <span className="text-red-500">*</span>
                  </label>
                  <input
                    type="text"
                    placeholder="e.g. 1042"
                    value={billNumber}
                    onChange={(e) => setBillNumber(e.target.value)}
                    className="w-full px-3 py-2.5 bg-white border-2 border-slate-200 rounded-2xl text-sm font-semibold uppercase outline-none focus:border-emerald-500"
                    required
                  />
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-slate-700 mb-1">Total Amount (Optional)</label>
                  <input
                    type="number"
                    inputMode="numeric"
                    placeholder="1000+"
                    value={claimedAmount}
                    onChange={(e) => setClaimedAmount(e.target.value)}
                    className="w-full px-3 py-2.5 bg-white border-2 border-slate-200 rounded-2xl text-sm font-semibold outline-none focus:border-emerald-500"
                  />
                </div>
              </div>

              {/* Smart Bill Booster Nudge */}
              {numericAmt >= MIN_BILL_AMOUNT && numericAmt < 2000 && (
                <div className="bg-amber-50 border border-amber-300 rounded-2xl px-3 py-2.5 text-xs text-amber-900 flex items-start gap-2 animate-pop">
                  <span className="text-base leading-none mt-0.5">💡</span>
                  <p className="leading-snug text-[11px]">
                    <strong>Smart Tip:</strong> ₹2,000+ ki shopping par seedha <strong>2 Stars</strong> milte hain! Agli baar ₹{2000 - numericAmt} aur add karne par double star payein.
                  </p>
                </div>
              )}
              {numericAmt >= 2000 && (
                <div className="bg-emerald-50 border border-emerald-300 rounded-2xl px-3 py-2 text-xs text-emerald-800 flex items-center gap-2 animate-pop">
                  <span className="text-base">🔥</span>
                  <p className="font-bold text-[11px]">
                    Shandar! ₹{numericAmt} ke bill par aapko {Math.floor(numericAmt / 1000)} Stars milenge!
                  </p>
                </div>
              )}

              <div>
                <label className="block text-[11px] font-bold text-slate-700 mb-1">
                  Bill Ki Photo <span className="text-red-500">*</span>
                </label>
                <label className="border-2 border-dashed border-emerald-300 hover:border-emerald-500 rounded-2xl p-3.5 flex flex-col items-center justify-center cursor-pointer bg-gradient-to-b from-emerald-50/70 to-amber-50/50 transition">
                  {previewImage ? (
                    <div className="text-center">
                      <img src={previewImage} className="max-h-44 rounded-xl shadow mx-auto" />
                      <span className="inline-block mt-2 text-[11px] font-bold text-emerald-700">
                        🔄 Photo Badalne Ke Liye Tap Karein
                      </span>
                    </div>
                  ) : (
                    <div className="text-center py-2.5">
                      <div className="text-2xl mb-1">📷</div>
                      <span className="text-xs font-extrabold text-emerald-800 block">
                        Camera Kholne / Bill Photo Chunne Ke Liye Tap Karein
                      </span>
                      <span className="text-[10px] text-slate-500">Clear bill photo upload karein</span>
                    </div>
                  )}
                  <input type="file" accept="image/*" capture="environment" onChange={handleFile} className="hidden" />
                </label>
              </div>

              <button
                type="submit"
                disabled={uploading}
                className="w-full bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-600 hover:from-emerald-700 hover:to-teal-700 text-white font-extrabold text-sm py-3.5 rounded-2xl shadow-lg shadow-emerald-600/25 transition active:scale-[0.99]"
              >
                {uploading ? "Uploading Bill..." : "✨ Submit Bill & Claim Star ⭐"}
              </button>
            </form>
          </div>

          {/* MISSING ITEM / DEMAND REQUEST BOX */}
          <div className="bg-white/95 backdrop-blur-md rounded-3xl shadow-md border border-white p-4">
            <div className="flex items-center gap-2 mb-2">
              <div className="w-8 h-8 rounded-xl bg-amber-100 text-base flex items-center justify-center shrink-0">
                💬
              </div>
              <div>
                <h3 className="font-extrabold text-slate-800 text-xs">
                  Koi Samaan Nahi Mila? Humein Batayein
                </h3>
                <p className="text-[10px] text-slate-500">
                  Item likhein—mangwa kar aapko WhatsApp par batayenge
                </p>
              </div>
            </div>

            {requestSentMsg && (
              <div className="mb-2.5 px-3 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-[11px] font-semibold animate-pop">
                {requestSentMsg}
              </div>
            )}

            <form onSubmit={handleItemRequestSubmit} className="flex gap-2">
              <input
                type="text"
                placeholder="Jaise: Amul Cheese, Organic Honey..."
                value={itemRequest}
                onChange={(e) => setItemRequest(e.target.value)}
                className="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-medium outline-none focus:bg-white focus:border-emerald-500"
              />
              <button
                type="submit"
                disabled={requestSending || !itemRequest.trim()}
                className="px-4 py-2.5 rounded-2xl bg-slate-900 hover:bg-slate-800 disabled:opacity-40 text-white font-bold text-xs shrink-0"
              >
                {requestSending ? "..." : "Bhejein"}
              </button>
            </form>
          </div>

          {/* CUSTOMER BILL HISTORY */}
          {myBills.length > 0 && (
            <div className="bg-white/95 backdrop-blur-md rounded-3xl shadow-md border border-white p-5">
              <h3 className="font-extrabold text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-1.5">
                🧾 Aapke Uploaded Bills ({myBills.length})
              </h3>
              <div className="space-y-2">
                {myBills.map((b) => {
                  const awarded = b.starsAwarded || 1;
                  return (
                    <div
                      key={b.id}
                      className={`flex items-center justify-between gap-2 p-3 rounded-2xl border ${
                        b.status === "approved"
                          ? "bg-emerald-50/80 border-emerald-200"
                          : b.status === "pending"
                          ? "bg-amber-50/80 border-amber-200"
                          : "bg-red-50/80 border-red-200"
                      }`}
                    >
                      <div className="min-w-0">
                        <p className="text-xs font-extrabold text-slate-800">
                          Invoice #{b.billNumber}
                          {b.claimedAmount > 0 ? ` • ₹${b.claimedAmount}` : ""}
                        </p>
                        <p className="text-[10px] text-slate-500 mt-0.5">
                          📅 {formatDateTime(b.createdAt)}
                        </p>
                        {b.status === "rejected" && b.rejectReason && (
                          <p className="text-[11px] text-red-600 mt-0.5">Reason: {b.rejectReason}</p>
                        )}
                      </div>

                      <div className="flex items-center gap-1.5 shrink-0">
                        {b.imageBase64 && (
                          <button
                            type="button"
                            onClick={() =>
                              setZoomBillData({
                                src: b.imageBase64,
                                title: `Invoice #${b.billNumber} (${formatDateTime(b.createdAt)})`
                              })
                            }
                            className="px-2 py-1 rounded-lg bg-white border border-slate-300 text-[10px] font-bold text-slate-700 hover:bg-slate-100"
                            title="Zoom Bill Photo"
                          >
                            🔍 Bill
                          </button>
                        )}
                        <span
                          className={`text-[11px] font-extrabold px-2.5 py-1 rounded-full ${
                            b.status === "pending"
                              ? "bg-amber-200/80 text-amber-900"
                              : b.status === "approved"
                              ? "bg-emerald-600 text-white shadow-sm"
                              : "bg-red-100 text-red-800"
                          }`}
                        >
                          {b.status === "pending"
                            ? "⏳ Pending"
                            : b.status === "approved"
                            ? `⭐ +${awarded} ${awarded > 1 ? "Stars" : "Star"}`
                            : "❌ Rejected"}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {zoomBillData && (
            <BillZoomModal
              src={zoomBillData.src}
              title={zoomBillData.title}
              onClose={() => setZoomBillData(null)}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // ADMIN PORTAL (OWNER DASHBOARD - NO DELETE, PERMANENT BILL RECORDS, ZOOM RETAINED)
    // ==========================================
    function AdminPortal() {
      const [unlocked, setUnlocked] = useState(false);
      const [pin, setPin] = useState("");
      const [tab, setTab] = useState("pending"); // pending | customers | records | demands
      const [customerFilter, setCustomerFilter] = useState("all"); // all | reminder_7 | near_complete | inactive_15
      const [searchQuery, setSearchQuery] = useState("");
      const [pendingBills, setPendingBills] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [itemRequests, setItemRequests] = useState([]);
      const [starInputs, setStarInputs] = useState({});
      const [zoomData, setZoomData] = useState(null);

      // Date-by-Date Customer Bill Records State
      const [selectedRecordPhone, setSelectedRecordPhone] = useState("");
      const [recordSearch, setRecordSearch] = useState("");
      const [customerRecordBills, setCustomerRecordBills] = useState([]);
      const [loadingRecords, setLoadingRecords] = useState(false);

      useEffect(() => {
        if (!unlocked) return;

        const qBills = query(collection(db, "bill_submissions"), where("status", "==", "pending"));
        const unsub1 = onSnapshot(qBills, (snap) => {
          const list = [];
          snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
          list.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
          setPendingBills(list);
        });

        const unsub2 = onSnapshot(collection(db, "customers"), (snap) => {
          const list = [];
          snap.forEach((d) => list.push(d.data()));
          list.sort((a, b) => (b.totalApprovedBills || 0) - (a.totalApprovedBills || 0));
          setCustomers(list);
        });

        const unsub3 = onSnapshot(collection(db, "item_requests"), (snap) => {
          const list = [];
          snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
          list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
          setItemRequests(list);
        });

        return () => {
          unsub1();
          unsub2();
          unsub3();
        };
      }, [unlocked]);

      // Load date-by-date bills for selected customer in Bill Records tab
      useEffect(() => {
        if (!unlocked || !selectedRecordPhone) {
          setCustomerRecordBills([]);
          return;
        }

        setLoadingRecords(true);
        const qRec = query(collection(db, "bill_submissions"), where("phone", "==", selectedRecordPhone));
        const unsubRec = onSnapshot(qRec, (snap) => {
          const list = [];
          snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
          // Sort Date-by-Date (newest first)
          list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
          setCustomerRecordBills(list);
          setLoadingRecords(false);
        });

        return () => unsubRec();
      }, [unlocked, selectedRecordPhone]);

      const getStarsForBill = (bill) => {
        if (starInputs[bill.id] !== undefined) return Number(starInputs[bill.id]);
        if (bill.claimedAmount >= 2000) return Math.floor(bill.claimedAmount / 1000);
        return 1;
      };

      const handleApprove = async (bill) => {
        const starsToGive = getStarsForBill(bill);
        if (!starsToGive || starsToGive < 1) {
          return alert("Kam se kam 1 Star select karein.");
        }

        const custRef = doc(db, "customers", bill.phone);
        const snap = await getDoc(custRef);
        const newStars = (snap.exists() ? snap.data().stars || 0 : 0) + starsToGive;

        await updateDoc(custRef, {
          stars: newStars,
          totalApprovedBills: increment(1),
          lastActivityAt: serverTimestamp()
        });

        // Keep imageBase64 permanently stored for date-by-date records
        await updateDoc(doc(db, "bill_submissions", bill.id), {
          status: "approved",
          starsAwarded: starsToGive
        });

        if (
          window.confirm(
            `Approved (+${starsToGive} ${starsToGive > 1 ? "Stars" : "Star"})!\n${bill.customerName} ke ab ${newStars} Stars ho gaye.\nWhatsApp message bhejna hai?`
          )
        ) {
          const starLabel = `+${starsToGive} ${starsToGive > 1 ? "Stars" : "Star"}`;
          const baseMsg =
            newStars >= STARS_FOR_REWARD
              ? `Namaste ${bill.customerName} ji! ${STORE_NAME} mein aapka Invoice #${bill.billNumber} verify ho gaya hai (${starLabel}) aur aapke ${STARS_FOR_REWARD}/${STARS_FOR_REWARD} Stars poore ho gaye hain! Aapka special Offer/Gift ready hai—agli shopping par counter par claim karein.`
              : `Namaste ${bill.customerName} ji! ${STORE_NAME} mein aapka Invoice #${bill.billNumber} verify ho gaya hai (${starLabel}). Total Stars: ${newStars}/${STARS_FOR_REWARD}.`;
          const fullMsg = `${baseMsg}\n\nTo view: ${SITE_URL}`;
          window.open(`https://wa.me/91${bill.phone}?text=${encodeURIComponent(fullMsg)}`, "_blank");
        }
      };

      const handleReject = async (bill) => {
        const reason = window.prompt("Reject reason likhein:", "Bill ₹1000 se kam hai ya photo clear nahi hai");
        if (reason === null) return;
        // Keep imageBase64 stored in history
        await updateDoc(doc(db, "bill_submissions", bill.id), {
          status: "rejected",
          rejectReason: reason
        });
      };

      // Direct +1 Star Entry for walk-in customers
      const handleDirectAddStar = async (cust) => {
        if (!window.confirm(`"${cust.name}" (+91 ${cust.phone}) ke card mein direct +1 Star add karein?`)) return;

        const newStars = (cust.stars || 0) + 1;
        await updateDoc(doc(db, "customers", cust.phone), {
          stars: newStars,
          totalApprovedBills: increment(1),
          lastActivityAt: serverTimestamp()
        });

        if (
          window.confirm(
            `+1 Star add ho gaya! Ab ${cust.name} ke ${newStars} Stars ho gaye.\nWhatsApp par update bhejna hai?`
          )
        ) {
          const baseMsg =
            newStars >= STARS_FOR_REWARD
              ? `Namaste ${cust.name} ji! ${STORE_NAME} mein aapke card par +1 Star add ho gaya hai aur aapke ${STARS_FOR_REWARD}/${STARS_FOR_REWARD} Stars poore ho gaye hain! Aapka special Offer/Gift ready hai—agli shopping par counter par claim karein.`
              : `Namaste ${cust.name} ji! ${STORE_NAME} mein aapke card par +1 Star add ho gaya hai. Total Stars: ${newStars}/${STARS_FOR_REWARD}.`;
          const fullMsg = `${baseMsg}\n\nTo view: ${SITE_URL}`;
          window.open(`https://wa.me/91${cust.phone}?text=${encodeURIComponent(fullMsg)}`, "_blank");
        }
      };

      const handleRedeem = async (cust) => {
        if (!window.confirm(`${cust.name} ka reward redeem mark karein? (${STARS_FOR_REWARD} stars reset honge)`)) return;
        await updateDoc(doc(db, "customers", cust.phone), {
          stars: Math.max(0, cust.stars - STARS_FOR_REWARD),
          rewardsEarned: increment(1),
          lastActivityAt: serverTimestamp()
        });
      };

      const handleSendReminder = async (cust, waMsg) => {
        window.open(`https://wa.me/91${cust.phone}?text=${encodeURIComponent(waMsg)}`, "_blank");
        try {
          await updateDoc(doc(db, "customers", cust.phone), {
            lastReminderAt: serverTimestamp()
          });
        } catch (err) {
          console.error("Reminder timestamp update failed:", err);
        }
      };

      const handleOpenCustomerRecords = (phone) => {
        setSelectedRecordPhone(phone);
        setTab("records");
      };

      const handleNotifyAndCloseDemand = async (req) => {
        const msg = `Namaste ${req.customerName} ji! ${STORE_NAME} par aapka manga hua item "${req.itemName}" store par aa gaya hai. Aap apni suvidha ke anusaar le sakte hain!\n\nTo view: ${SITE_URL}`;
        window.open(`https://wa.me/91${req.phone}?text=${encodeURIComponent(msg)}`, "_blank");
      };

      const handleDeleteDemand = async (id) => {
        await deleteDoc(doc(db, "item_requests", id));
      };

      if (!unlocked) {
        return (
          <div className="bg-white rounded-2xl shadow-sm border p-6 mt-6 max-w-sm mx-auto">
            <h2 className="text-lg font-bold text-center">Owner Verification Portal</h2>
            <form
              onSubmit={(e) => {
                e.preventDefault();
                pin === ADMIN_PIN ? setUnlocked(true) : alert("Galat Password!");
              }}
              className="mt-4 space-y-3"
            >
              <input
                type="password"
                placeholder="Enter Owner Password"
                value={pin}
                onChange={(e) => setPin(e.target.value)}
                className="w-full text-center text-lg py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-600"
                autoFocus
              />
              <button className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl">
                Unlock Dashboard
              </button>
            </form>
          </div>
        );
      }

      // Compute Filter Counts & Search
      const reminderDueCount = customers.filter((c) => getReminderStatus(c).due).length;
      const inactiveCount = customers.filter((c) => {
        const d = getDaysSince(c.lastActivityAt);
        return d !== null && d >= INACTIVE_DAYS_LIMIT;
      }).length;

      const filteredCustomers = (() => {
        let base = customers;
        if (customerFilter === "reminder_7") {
          base = [...customers]
            .filter((c) => getReminderStatus(c).due)
            .sort((a, b) => (getReminderStatus(b).daysSince || 999) - (getReminderStatus(a).daysSince || 999));
        } else if (customerFilter === "near_complete") {
          base = [...customers]
            .filter((c) => c.stars > 0 && c.stars < STARS_FOR_REWARD)
            .sort((a, b) => b.stars - a.stars);
        } else if (customerFilter === "inactive_15") {
          base = [...customers]
            .filter((c) => {
              const d = getDaysSince(c.lastActivityAt);
              return d !== null && d >= INACTIVE_DAYS_LIMIT;
            })
            .sort((a, b) => getDaysSince(b.lastActivityAt) - getDaysSince(a.lastActivityAt));
        }

        const q = searchQuery.trim().toLowerCase();
        if (!q) return base;
        return base.filter(
          (c) =>
            (c.name && c.name.toLowerCase().includes(q)) ||
            (c.phone && c.phone.includes(q))
        );
      })();

      const recordSelectableCustomers = (() => {
        const q = recordSearch.trim().toLowerCase();
        const sorted = [...customers].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
        if (!q) return sorted;
        return sorted.filter(
          (c) =>
            (c.name && c.name.toLowerCase().includes(q)) ||
            (c.phone && c.phone.includes(q))
        );
      })();

      const selectedRecordCustomer = customers.find((c) => c.phone === selectedRecordPhone) || null;

      return (
        <div className="space-y-4 mt-1">
          {/* 4-Button Navigation Bar including Dedicated Bill Records Button */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5 bg-slate-200 p-1.5 rounded-2xl">
            <button
              onClick={() => setTab("pending")}
              className={`py-2 px-2 rounded-xl text-xs font-extrabold transition ${
                tab === "pending" ? "bg-white text-emerald-800 shadow" : "text-slate-600"
              }`}
            >
              🧾 Pending ({pendingBills.length})
            </button>
            <button
              onClick={() => setTab("customers")}
              className={`py-2 px-2 rounded-xl text-xs font-extrabold transition ${
                tab === "customers" ? "bg-white text-emerald-800 shadow" : "text-slate-600"
              }`}
            >
              👥 Customers ({customers.length})
            </button>
            <button
              onClick={() => setTab("records")}
              className={`py-2 px-2 rounded-xl text-xs font-extrabold transition ${
                tab === "records" ? "bg-emerald-700 text-white shadow" : "text-slate-700 bg-white/60"
              }`}
            >
              🗂️ Bill Records
            </button>
            <button
              onClick={() => setTab("demands")}
              className={`py-2 px-2 rounded-xl text-xs font-extrabold transition ${
                tab === "demands" ? "bg-white text-emerald-800 shadow" : "text-slate-600"
              }`}
            >
              📦 Demands ({itemRequests.length})
            </button>
          </div>

          {/* TAB 1: PENDING BILLS */}
          {tab === "pending" && (
            <div className="space-y-4">
              {pendingBills.length === 0 ? (
                <div className="bg-white rounded-2xl p-8 text-center border">
                  <p className="font-bold text-slate-700">✅ Koi pending bill nahi hai!</p>
                </div>
              ) : (
                pendingBills.map((b) => {
                  const selectedStars = getStarsForBill(b);
                  return (
                    <div key={b.id} className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                      <div className="p-4 border-b flex justify-between items-start">
                        <div>
                          <h3 className="font-bold">{b.customerName}</h3>
                          <p className="text-xs text-slate-500">+91 {b.phone}</p>
                          <p className="text-[11px] text-slate-400 mt-0.5">📅 {formatDateTime(b.createdAt)}</p>
                        </div>
                        <div className="text-right">
                          <span className="bg-amber-100 text-amber-900 font-bold text-xs px-2.5 py-1 rounded">
                            Invoice #{b.billNumber}
                          </span>
                          {b.claimedAmount > 0 && (
                            <p className="text-sm font-bold text-emerald-700 mt-1">₹{b.claimedAmount}</p>
                          )}
                        </div>
                      </div>

                      {b.imageBase64 && (
                        <div className="bg-slate-900 flex flex-col items-center p-2 relative">
                          <img
                            src={b.imageBase64}
                            onClick={() =>
                              setZoomData({
                                src: b.imageBase64,
                                title: `${b.customerName} • Invoice #${b.billNumber}`
                              })
                            }
                            className="max-h-64 object-contain cursor-zoom-in"
                          />
                          <button
                            type="button"
                            onClick={() =>
                              setZoomData({
                                src: b.imageBase64,
                                title: `${b.customerName} • Invoice #${b.billNumber}`
                              })
                            }
                            className="mt-2 px-3 py-1 rounded-full bg-white/15 hover:bg-white/25 text-white text-[11px] font-bold border border-white/20"
                          >
                            🔍 Photo Zoom Karein
                          </button>
                        </div>
                      )}

                      {/* Open Star Selection Bar */}
                      <div className="px-4 py-3 bg-emerald-50/70 border-t border-emerald-100 flex items-center justify-between gap-2">
                        <div>
                          <p className="text-xs font-bold text-slate-800">⭐ Kitne Stars Dene Hain?</p>
                          <p className="text-[11px] text-slate-500">₹1000 = 1★, ₹2000 = 2★ (Rice chhodkar)</p>
                        </div>
                        <div className="flex items-center gap-1.5">
                          {[1, 2, 3].map((num) => (
                            <button
                              key={num}
                              type="button"
                              onClick={() => setStarInputs({ ...starInputs, [b.id]: num })}
                              className={`px-2.5 py-1.5 rounded-lg text-xs font-bold border ${
                                selectedStars === num
                                  ? "bg-amber-400 border-amber-500 text-slate-900 shadow-sm"
                                  : "bg-white border-slate-300 text-slate-600"
                              }`}
                            >
                              {num}★
                            </button>
                          ))}
                          <input
                            type="number"
                            min="1"
                            max="20"
                            value={selectedStars}
                            onChange={(e) => setStarInputs({ ...starInputs, [b.id]: e.target.value })}
                            className="w-12 text-center py-1.5 border border-slate-300 rounded-lg text-xs font-bold bg-white"
                            title="Custom Stars"
                          />
                        </div>
                      </div>

                      <div className="p-3 grid grid-cols-2 gap-3 bg-slate-50 border-t">
                        <button
                          onClick={() => handleReject(b)}
                          className="py-2.5 rounded-xl border border-red-200 bg-white text-red-600 font-bold text-sm"
                        >
                          ❌ Reject
                        </button>
                        <button
                          onClick={() => handleApprove(b)}
                          className="py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm"
                        >
                          ✅ Approve (+{selectedStars} {selectedStars > 1 ? "Stars" : "Star"})
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}

          {/* TAB 2: CUSTOMERS LIST (DELETE BUTTON REMOVED) */}
          {tab === "customers" && (
            <div className="space-y-3">
              {/* Instant Search Box */}
              <div className="relative">
                <input
                  type="text"
                  placeholder="🔍 Naam ya mobile number se search karein..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-3.5 pr-9 py-2.5 bg-white border border-slate-300 rounded-xl text-xs font-medium outline-none focus:ring-2 focus:ring-emerald-500"
                />
                {searchQuery && (
                  <button
                    onClick={() => setSearchQuery("")}
                    className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs font-bold"
                  >
                    ✕
                  </button>
                )}
              </div>

              {/* Filter Buttons */}
              <div className="flex flex-wrap gap-1.5 bg-white p-2 rounded-xl border border-slate-200">
                <button
                  onClick={() => setCustomerFilter("all")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold ${
                    customerFilter === "all"
                      ? "bg-slate-900 text-white"
                      : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                  }`}
                >
                  All ({customers.length})
                </button>
                <button
                  onClick={() => setCustomerFilter("reminder_7")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold ${
                    customerFilter === "reminder_7"
                      ? "bg-emerald-700 text-white"
                      : "bg-emerald-50 text-emerald-800 border border-emerald-200"
                  }`}
                >
                  🔔 7-Day Reminder ({reminderDueCount})
                </button>
                <button
                  onClick={() => setCustomerFilter("near_complete")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold ${
                    customerFilter === "near_complete"
                      ? "bg-amber-500 text-white"
                      : "bg-amber-50 text-amber-800 border border-amber-200"
                  }`}
                >
                  ⭐ Near Complete (Desc)
                </button>
                <button
                  onClick={() => setCustomerFilter("inactive_15")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold ${
                    customerFilter === "inactive_15"
                      ? "bg-red-600 text-white"
                      : "bg-red-50 text-red-700 border border-red-200"
                  }`}
                >
                  ⏳ 15+ Days Inactive ({inactiveCount})
                </button>
              </div>

              {filteredCustomers.length === 0 ? (
                <div className="bg-white rounded-2xl p-6 text-center border text-xs text-slate-500">
                  Koi customer nahi mila.
                </div>
              ) : (
                filteredCustomers.map((c) => {
                  const daysInactive = getDaysSince(c.lastActivityAt);
                  const daysLeft = daysInactive !== null ? Math.max(0, INACTIVE_DAYS_LIMIT - daysInactive) : null;
                  const remStatus = getReminderStatus(c);
                  const starsRemaining = Math.max(0, STARS_FOR_REWARD - (c.stars || 0));

                  const baseWaMsg =
                    starsRemaining === 0
                      ? `Namaste ${c.name} ji! ${STORE_NAME} par aapke ${c.stars}/${STARS_FOR_REWARD} Stars poore ho chuke hain! Apna special Offer/Gift claim karne ke liye jald hi store par aayein.`
                      : starsRemaining === 1
                      ? `Namaste ${c.name} ji! ${STORE_NAME} par aapke ${c.stars}/${STARS_FOR_REWARD} Stars ho gaye hain—Free Gift & Offer unlock karne ke liye sirf 1 Star aur baaki hai! Is hafte ₹1000+ ki shopping par apna card complete karein.`
                      : daysInactive !== null && daysInactive >= INACTIVE_DAYS_LIMIT
                      ? `Namaste ${c.name} ji! ${STORE_NAME} par aapke ${c.stars}/${STARS_FOR_REWARD} Stars hain. Aapko store aaye ${daysInactive} din ho gaye hain—is hafte ₹1000+ ki shopping par agla Star jodein!`
                      : `Namaste ${c.name} ji! ${STORE_NAME} mein aapke ${c.stars}/${STARS_FOR_REWARD} Stars hain. Is hafte ₹1000+ ki shopping par agla Star jodein!`;

                  const waMsg = `${baseWaMsg}\n\nTo view: ${SITE_URL}`;

                  return (
                    <div key={c.phone} className="bg-white rounded-2xl p-3.5 border flex items-center justify-between gap-2">
                      <div className="min-w-0">
                        <div className="flex items-center flex-wrap gap-1.5">
                          <p className="font-bold text-sm truncate">{c.name}</p>
                          <span className="text-xs bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full">
                            {c.stars}/{STARS_FOR_REWARD} ★
                          </span>
                          {remStatus.due ? (
                            <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">
                              🔔 Reminder Due
                            </span>
                          ) : (
                            <span className="text-[10px] bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full">
                              Next rem: {remStatus.nextInDays}d
                            </span>
                          )}
                          {daysInactive !== null && (
                            daysInactive >= INACTIVE_DAYS_LIMIT ? (
                              <span className="text-[10px] bg-red-100 text-red-700 font-bold px-2 py-0.5 rounded-full">
                                ⚠️ {daysInactive}d inactive
                              </span>
                            ) : (
                              <span className="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">
                                ⏳ {daysLeft}d left
                              </span>
                            )
                          )}
                        </div>
